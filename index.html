<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Temporizador del día</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:#000;color:#fff;font-family:-apple-system,system-ui,sans-serif;min-height:100vh;padding-bottom:90px}
section{padding:16px;padding-top:max(20px,env(safe-area-inset-top));display:none;max-width:720px;margin:0 auto}
section.on{display:block}
h2{font-size:26px;margin-bottom:14px}
h3{font-size:18px;margin:18px 0 8px;color:#ddd}
.row{display:flex;gap:8px;margin-bottom:12px}
input{background:#1c1c1e;border:1px solid #333;color:#fff;border-radius:10px;padding:12px;font-size:16px;min-width:0}
input.name{flex:1}
input.min{width:84px;text-align:center}
.btn{background:#0a84ff;color:#fff;border:none;border-radius:10px;padding:12px 16px;font-size:16px;font-weight:600}
.btn.big{width:100%;padding:16px;font-size:18px;background:#34c759;margin-top:8px}
.btn.gray{background:#2c2c2e}
.btn.red{background:#ff3b30}
ul{list-style:none}
li{display:flex;align-items:center;gap:10px;background:#1c1c1e;border-radius:12px;padding:12px;margin-bottom:8px}
li .n{flex:1;font-size:17px}
li .t{color:#34c759;font-variant-numeric:tabular-nums;padding:6px 8px;border-radius:8px;background:#0f2a17}
li{touch-action:pan-y;user-select:none;-webkit-user-select:none;position:relative}
li.over{box-shadow:inset 0 3px 0 #0a84ff}
li{-webkit-touch-callout:none}
li.drag{z-index:3;background:#2c2c2e;box-shadow:0 8px 24px rgba(0,0,0,.6);transition:none;touch-action:none}
.grip{color:#666;font-size:20px;padding:0 4px;touch-action:none;cursor:grab}
li input.min{width:80px;padding:8px}
li button{background:none;border:none;color:#888;font-size:20px;padding:0 6px}
.muted{color:#888}
.empty{color:#666;text-align:center;padding:30px}
.presets{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.presets button{background:#1c1c1e;color:#fff;border:1px solid #333;border-radius:20px;padding:8px 16px;font-size:15px}
.preview{font-size:72px;font-weight:700;color:#34c759;text-align:center;font-variant-numeric:tabular-nums;margin:10px 0 16px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#111;border-top:1px solid #222;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;background:none;border:none;color:#777;padding:10px 0 12px;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button span{font-size:24px}
nav button.on{color:#0a84ff}
/* corredor */
#run{position:fixed;inset:0;background:#000;display:none;flex-direction:row;align-items:stretch;z-index:9;padding:max(12px,env(safe-area-inset-top)) max(8px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left))}
#run.on{display:flex}
.mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:0}
#clock{font-size:min(26vw,66vh);font-weight:700;font-variant-numeric:tabular-nums;line-height:1;color:#34c759;transition:color .5s;letter-spacing:-.02em}
#label{font-size:min(5vw,7vh);margin-top:0;text-align:center;line-height:1.15}
#sub{color:#777;margin-top:.8vh;font-size:min(3.2vw,3.6vh);text-align:center}
.side{width:min(13vw,120px);display:flex;flex-direction:column;align-items:center;justify-content:space-around;flex-shrink:0;padding:70px 0}
.side button{background:none;border:none;color:#0a84ff;padding:12px;display:flex;align-items:center;justify-content:center}
.side svg{width:min(9vw,56px);height:min(9vw,56px);fill:#0a84ff}
.side .txt{font-size:min(4.5vw,24px);font-weight:600}
.sync{display:flex;align-items:center;gap:10px;background:#1c1c1e;border-radius:12px;padding:10px 12px;margin-bottom:14px;font-size:14px;color:#aaa}
.sync .dot{width:9px;height:9px;border-radius:50%;background:#666;flex-shrink:0}
.sync .dot.ok{background:#34c759}.sync .dot.busy{background:#ffd60a}.sync .dot.err{background:#ff3b30}
.sync span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sync button{background:#0a84ff;color:#fff;border:none;border-radius:8px;padding:8px 12px;font-size:14px;font-weight:600;white-space:nowrap}
.sync button.lnk{background:none;color:#0a84ff;padding:4px}
@media (orientation:portrait){
  #run{display:none;flex-direction:column;padding:max(24px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom))}
  #run.on{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr auto;grid-template-areas:"mid mid" "l r";align-items:end}
  #run .mid{grid-area:mid;align-self:center}
  #run .side{width:auto;flex-direction:row;justify-content:space-evenly;padding:0 0 8px}
  #run .side:first-of-type{grid-area:l}
  #run .side:last-of-type{grid-area:r}
  #label{font-size:7vw;margin-top:2vh}
  #sub{font-size:4vw}
}
.daynav{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.daynav button{background:#1c1c1e;border:none;color:#fff;font-size:22px;border-radius:10px;width:48px;height:44px}
.daynav label{flex:1;position:relative;background:#1c1c1e;border-radius:10px;height:44px;display:flex;align-items:center;justify-content:center;font-size:16px;color:#ddd;text-transform:capitalize}
.daynav input{position:absolute;inset:0;opacity:0;width:100%;height:100%}
.copyrow{display:flex;gap:8px;margin-top:8px}
.copyrow button{flex:1;background:none;border:1px solid #333;color:#aaa;border-radius:10px;padding:10px;font-size:14px}
.brkset{display:flex;align-items:center;gap:8px;color:#aaa;font-size:15px;margin:8px 0}
.brkset input{width:70px;padding:8px}
#run.brk{background:#1f8f4e}
#run.brk .mid{align-self:stretch!important;height:100%}
#run.brk #clock{margin-bottom:1vh}
#run.brk .mid{display:grid;grid-template-rows:1fr 1fr;justify-items:center;width:100%}
#run.brk #clock{color:#fff!important;align-self:center}
#run.brk .lbl{align-self:center;text-align:center}
#run.brk #label{font-size:min(15vw,17vh);font-weight:700;color:#fff;margin-top:1vh}
#run.brk #sub{color:rgba(255,255,255,.85);font-size:min(4.5vw,4.5vh)}
#run.brk .side svg{fill:#fff}#run.brk .side button{color:#fff}
#run.brk #ver{color:rgba(255,255,255,.4)!important}
.chg{background:rgba(255,255,255,.2);color:#fff;border:none;border-radius:16px;padding:6px 14px;margin-left:8px;font-size:inherit;font-weight:600}
.picklist{display:flex;flex-direction:column;gap:8px;margin-top:14px;max-height:50vh;overflow:auto}
.picklist button{display:flex;justify-content:space-between;gap:10px;background:#2c2c2e;border:2px solid transparent;color:#fff;border-radius:12px;padding:14px;font-size:17px;text-align:left}
.picklist button.on{border-color:#34c759}
.linkbtn{background:none;border:none;color:#0a84ff;font-size:15px;padding:14px 0;width:100%}
.chk{width:28px;height:28px;border-radius:50%;border:2px solid #555!important;background:none;color:#fff!important;font-size:16px!important;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0!important;flex-shrink:0}
li.done{opacity:.6}
li.done .n{text-decoration:line-through;color:#999}
li.done .t{background:none;color:#888}
li.done .chk{background:#34c759!important;border-color:#34c759!important}
.upd{display:flex;align-items:center;gap:10px;background:#0a84ff;color:#fff;border-radius:12px;padding:12px 14px;margin-bottom:14px;font-size:15px}
.upd span{flex:1}.upd button{background:#fff;color:#0a84ff;border:none;border-radius:8px;padding:8px 12px;font-weight:700;font-size:14px}
.sel{width:100%;background:#2c2c2e;color:#fff;border:1px solid #333;border-radius:10px;padding:12px;font-size:16px;-webkit-appearance:none;appearance:none;padding-right:38px;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8'><path d='M0 0l6 8 6-8z' fill='%23aaa'/></svg>");background-repeat:no-repeat;background-position:right 14px center}
.minib{margin-top:2vh;background:#1c1c1e;color:#fff;border:1px solid #3a3a3c;border-radius:22px;padding:10px 18px;font-size:min(4vw,17px);font-weight:600}
.prog{display:block;font-size:13px;color:#ff9f0a;margin-top:3px}
.contb{display:inline-block;margin-top:6px;background:#ff9f0a;color:#000;border:none;border-radius:14px;padding:6px 12px;font-size:14px;font-weight:700}
textarea{width:100%;background:#1c1c1e;border:1px solid #333;color:#fff;border-radius:10px;padding:12px;font-size:16px;font-family:inherit;resize:vertical}
.note{background:#2c2c2e;border-radius:8px;padding:8px 10px;margin-top:6px;font-size:14px;color:#ddd;line-height:1.35}
.sug{background:#0f2a17;border:1px solid #1f5c33;border-radius:10px;padding:10px 12px;margin-top:8px;text-align:left;color:#34c759;font-size:15px;line-height:1.35}
.sug span{color:#aaa;font-size:13px}.sug button{background:#34c759;color:#000;border:none;border-radius:8px;padding:4px 10px;font-weight:700;margin-left:4px}
.otv{color:#ff453a;font-weight:700;font-size:17px;margin-top:8px}.otv:empty{display:none}
.timerow{display:flex;align-items:center;gap:8px;margin:-4px 0 12px;color:#aaa;font-size:15px}
.timerow span{flex:1}.timerow small{color:#666}
.timerow input{background:#1c1c1e;border:1px solid #333;color:#fff;border-radius:10px;padding:8px 10px;font-size:16px;min-width:110px}
.timerow .clr{background:none;border:none;color:#666;font-size:18px}
.tchip{flex-shrink:0;background:#1a2f4d;color:#64a8ff;border-radius:8px;padding:5px 8px;font-size:14px;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.tchip.none{background:none;color:#555;padding:5px 4px;font-weight:400}
.tedit{display:flex;align-items:center;gap:4px}.tedit input{background:#1c1c1e;border:1px solid #333;color:#fff;border-radius:8px;padding:6px;font-size:15px;width:110px}
.tedit button{background:none;border:none;color:#888;font-size:16px}
.calbtn{width:100%;background:#1a2f4d;color:#64a8ff;border:none;border-radius:12px;padding:12px;font-size:15px;font-weight:600;margin:4px 0 4px}
.entry{cursor:pointer}
.note .nh{display:flex;justify-content:space-between;align-items:center;color:#888;font-size:12px;margin-bottom:3px}
.note .nh button{background:none;border:none;color:#666;font-size:14px;padding:0 2px}
.note.post{background:#1a2f4d;color:#cfe3ff}
.detail{text-align:left}.detail h1{text-align:left}.detail h3{font-size:16px;margin:16px 0 6px;color:#ddd}
#mCard{max-height:88vh;overflow:auto}
.side .p5{color:#0a84ff;font-size:min(7vw,34px);font-weight:800;flex-direction:column;line-height:1;border:2px solid #0a84ff;border-radius:16px;padding:8px 10px}
.side .p5 small{font-size:min(3vw,13px);font-weight:600}
.side .p5.used{opacity:.25;pointer-events:none}
#run.brk .side .p5{border-color:#fff;color:#fff}
#dayTl h3{margin-top:20px}
.tlsum{color:#aaa;font-size:14px;margin-bottom:8px}.tlsum b{color:#fff}
.tlstrip{position:relative;height:16px;background:#1c1c1e;border-radius:6px;overflow:hidden}
.tlstrip i{position:absolute;top:0;bottom:0;border-radius:2px}
.tlax{display:flex;justify-content:space-between;color:#666;font-size:11px;margin:3px 0 10px}
.tlwrap{max-height:380px;overflow:auto;background:#111;border-radius:12px;padding:0 8px 0 0}
.tl{position:relative}
.tlh{position:absolute;left:0;right:0;border-top:1px solid #222}
.tlh span{position:absolute;left:6px;top:2px;color:#666;font-size:11px}
.tlb{position:absolute;left:54px;right:4px;border-radius:6px;padding:2px 8px;overflow:hidden;color:#fff;font-size:13px;line-height:1.25;cursor:pointer}
.tlb b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tlb span{color:#ccc;font-size:11px}
.tlnow{position:absolute;left:40px;right:0;border-top:2px solid #ff453a}
.tlleg{margin-top:10px}
.tll{display:flex;align-items:center;gap:8px;font-size:14px;color:#ddd;padding:3px 0}
.tll i{width:12px;height:12px;border-radius:3px;flex-shrink:0}.tll span{flex:1}.tll b{color:#aaa;font-weight:600}
.playb{width:38px;height:38px;border-radius:50%;background:#34c759!important;border:none;display:flex!important;align-items:center;justify-content:center;padding:0!important;flex-shrink:0}
.playb svg{width:18px;height:18px;fill:#000;margin-left:2px}
li .delb{padding:0 2px!important;font-size:17px!important}
li .t{white-space:nowrap;font-size:15px;padding:5px 7px}
li .n{font-size:16px;min-width:0;flex:1 1 auto;overflow-wrap:break-word}
.tchip{font-size:13px!important;padding:4px 6px!important}
li{gap:8px!important}
/* modal */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:20;padding:20px}
#modal.on{display:flex}
.card{background:#1c1c1e;border-radius:18px;padding:24px;width:100%;max-width:420px;text-align:center}
.card h1{font-size:28px;margin-bottom:6px}
.card .row{justify-content:center;margin-top:16px}
.card .btn{flex:1}
.card label{display:block;text-align:left;color:#aaa;margin:14px 0 6px;font-size:15px}
.card input{width:100%}
/* calendario */
.calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.calhead button{background:#1c1c1e;border:none;color:#fff;font-size:20px;border-radius:10px;width:44px;height:44px}
.calhead b{font-size:19px;text-transform:capitalize}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.grid .dw{text-align:center;color:#666;font-size:12px;padding:4px 0}
.day{aspect-ratio:1;background:#1c1c1e;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:16px;border:2px solid transparent}
.day.blank{background:none}
.day.has{background:#14361f}
.day.today{border-color:#0a84ff}
.day.sel{background:#0a84ff}
.day small{font-size:10px;color:#34c759}
.day.sel small{color:#fff}
.entry{background:#1c1c1e;border-radius:12px;padding:12px;margin-bottom:8px}
.entry .top{display:flex;justify-content:space-between;gap:8px}
.entry .top b{font-size:16px}
.entry .meta{color:#999;font-size:14px;margin-top:4px}
.over{color:#ff9f0a}.under{color:#34c759}
.seg{display:flex;background:#1c1c1e;border-radius:10px;padding:3px;margin:10px 0}
.seg button{flex:1;background:none;border:none;color:#aaa;padding:9px;border-radius:8px;font-size:15px}
.seg button.on{background:#3a3a3c;color:#fff}
</style>
</head>
<body>

<section id="s0" class="on">
  <h2>Temporizador <span style="color:#444;font-size:12px">v34</span></h2>
  <div id="updBox"></div>
  <div class="preview" id="tPrev">20:00</div>
  <div class="presets">
    <button onclick="setT(5)">5</button><button onclick="setT(10)">10</button>
    <button onclick="setT(15)">15</button><button onclick="setT(20)">20</button>
    <button onclick="setT(30)">30</button><button onclick="setT(45)">45</button>
    <button onclick="setT(60)">60</button>
  </div>
  <div class="row">
    <input class="name" id="tName" placeholder="Nombre (opcional)">
    <input class="min" id="tMin" type="number" inputmode="numeric" value="20" oninput="prev()">
  </div>
  <button class="btn big" onclick="startSingle()">▶ Iniciar</button>
  <button class="linkbtn" id="updBtn" onclick="checkUpdate(true)">⟳ Buscar actualización (tienes la v34)</button>
</section>

<section id="s1">
  <h2 id="planTitle">Plan de hoy</h2>
  <div class="sync" id="syncBar1"></div>
  <div class="daynav"><button onclick="moveDay(-1)">‹</button><label><span id="planDate"></span><input type="date" id="planPick" onchange="pickDay(this.value)"></label><button onclick="moveDay(1)">›</button></div>
  <div class="row">
    <input class="name" id="aName" placeholder="Actividad" list="known">
    <input class="min" id="aMin" type="number" inputmode="numeric" placeholder="min" value="25">
    <button class="btn" onclick="add()">+</button>
  </div>
  <div class="timerow"><span>⏰ Hora programada <small>(opcional)</small></span><input type="time" id="aTime"><button class="clr" onclick="$('aTime').value=''">✕</button></div>
  <datalist id="known"></datalist>
  <div class="muted" id="hint" style="margin:-4px 0 10px;font-size:14px"></div>
  <ul id="list"></ul>
  <div class="muted" id="total"></div>
  <div class="brkset">☕ Descanso entre actividades <input class="min" id="brkMin" type="number" inputmode="numeric" min="0" onchange="setBrk(this.value)"> min</div>
  <div id="calBox"></div>
  <button class="btn big" onclick="startList()">▶ Empezar</button>
  <div id="copyBox"></div>
  <button class="linkbtn" onclick="recoverForm()">↺ ¿Se cerró la app? Recuperar actividad en curso</button>
</section>

<section id="s2">
  <h2>Registro</h2>
  <div class="sync" id="syncBar2"></div>
  <div class="seg"><button id="vCal" class="on" onclick="view('cal')">Por día</button><button id="vAct" onclick="view('act')">Por actividad</button></div>
  <div id="calView">
    <div class="calhead"><button onclick="month(-1)">‹</button><b id="mLabel"></b><button onclick="month(1)">›</button></div>
    <div class="grid" id="grid"></div>
    <h3 id="dayTitle"></h3>
    <div id="dayList"></div>
    <div id="dayTl"></div>
    <button class="btn gray" style="width:100%;margin-top:6px" onclick="manualForm()">＋ Agregar registro manual</button>
    <button class="btn gray" style="width:100%;margin-top:8px" onclick="recoverForm()">↺ ¿Se borró tu actividad? Recuperarla</button>
  </div>
  <div id="actView" style="display:none"></div>
  <h3>Respaldo</h3>
  <div class="muted" style="font-size:14px;margin-bottom:8px">Pasa tu plan y tu registro a otro dispositivo, o guarda un respaldo.</div>
  <div class="row"><button class="btn gray" style="flex:1" onclick="exportData()">⬇︎ Exportar</button><button class="btn gray" style="flex:1" onclick="$('imp').click()">⬆︎ Importar</button></div>
  <input type="file" id="imp" accept=".json,application/json" style="display:none" onchange="importData(this)">
</section>

<nav>
  <button id="n0" class="on" onclick="tab(0)"><span>⏱</span>Temporizador</button>
  <button id="n1" onclick="tab(1)"><span>📋</span>Actividades</button>
  <button id="n2" onclick="tab(2)"><span>📅</span>Registro</button>
</nav>

<div id="run"><div id="ver" style="position:absolute;left:50%;bottom:4px;transform:translateX(-50%);color:#333;font-size:11px">v34</div>
  <div class="side">
    <button onclick="pause()"><svg viewBox="0 0 24 24"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg></button>
    <button id="p5" class="p5" onclick="plus5()">+5<small>min</small></button>
  </div>
  <div class="mid">
    <div id="clock">00:00</div>
    <div class="lbl"><div id="label"></div>
    <div id="sub"></div><button id="miniBtn" class="minib" onclick="startMini()" style="display:none"></button></div>
  </div>
  <div class="side">
    <button class="txt" onclick="stop()">Salir</button>
    <button onclick="play()"><svg viewBox="0 0 24 24"><path d="M7 4v16l13-8z"/></svg></button>
    <button onclick="finish()"><svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg></button>
  </div>
</div>

<div id="modal"><div class="card" id="mCard"></div></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const $=id=>document.getElementById(id);
const load=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}};
const store=(k,v)=>{if(k==='brk'){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){};return queueSync()}if(k==='acts'){plans[planDay]=acts;cleanPlans();k='plans';v=plans}try{localStorage.setItem(k,JSON.stringify(v))}catch(e){};if(k==='plans'||k==='log')queueSync()};
let log=load('log',[]),plans={},acts=[],planDay='';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const dkey=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
function initPlans(){
  plans=load('plans',null);
  if(!plans||typeof plans!=='object'){plans={};const old=load('acts',[]);if(old.length)plans[dkey(new Date())]=old}

function restoreRun(){
  const r=load('run',null);if(!r)return;
  queue=r.queue;idx=r.idx;inBreak=!!r.inBreak;cur=r.cur;total=r.total;remain=r.remain;
  const gone=r.running?(Date.now()-r.at)/1000:0;
  if(r.inOver&&r.overStart){$('run').classList.remove('brk');inBreak=false;begin(total,-(Date.now()-r.overStart)/1000);return}
  if(r.inMini&&r.miniSaved){miniSaved=r.miniSaved;const left=remain-gone;
    if(left>0){$('run').classList.remove('brk');begin(miniSaved.total,miniSaved.remain);running=false;clearInterval(timer);startMiniAt(left);return}
    const over=-left;total=miniSaved.total;remain=miniSaved.remain-over;cur.elapsed+=over;miniSaved=null;inMini=false;inBreak=false;
    $('run').classList.remove('brk');if(remain<=0)cur.elapsed+=remain;begin(total,remain);return}
  remain-=gone;if(cur&&!inBreak)cur.elapsed+=gone;
  if(inBreak){if(remain<=0)return go(idx+1);startBreakAt(total,remain);return}
  $('run').classList.remove('brk');

}

function recCalc(){

  if(S>Date.now())S-=24*3600e3;

}

  const [y,m,d]=selDay.split('-').map(Number);
  modal(`<h1>Registro manual</h1><div class="muted">${new Date(y,m-1,d).toLocaleDateString('es-MX',{weekday:'long',day:'numeric',month:'long'})}</div>
  <label>Actividad</label><input id="mN" list="mList" placeholder="ej. Limpieza baño"><datalist id="mList">${opts}</datalist>
  <label>Hora de inicio</label><input id="mH" type="time" value="${hh}">
  <div class="row" style="margin:0;gap:10px"><div style="flex:1"><label>Tiempo estimado (min)</label><input id="mP" type="number" inputmode="numeric" placeholder="ej. 30"></div>
  <div style="flex:1"><label>Tiempo real (min)</label><input id="mR" type="number" inputmode="numeric" placeholder="ej. 45"></div></div>
  <label style="display:flex;align-items:center;gap:10px;color:#fff"><input id="mOk" type="checkbox" checked style="width:22px;height:22px"> La terminé</label>
  <div class="row"><button class="btn gray" onclick="closeModal()">Cancelar</button><button class="btn" onclick="saveManual()">Guardar</button></div>`);
  $('mN').addEventListener('input',()=>{const st=stats()[$('mN').value.trim().toLowerCase()];if(st&&!$('mP').value)$('mP').value=Math.round(st.pavg)});
}
function saveManual(){
  const n=$('mN').value.trim(),h=$('mH').value||'12:00',r=parseFloat($('mR').value),pl=parseFloat($('mP').value);
  let bad=false;if(!n){$('mN').style.borderColor='#ff3b30';bad=true}if(!(r>0)){$('mR').style.borderColor='#ff3b30';bad=true}if(bad)return;
  const [yy,mm,dd]=selDay.split('-').map(Number),[hh,mi]=h.split(':').map(Number),st=new Date(yy,mm-1,dd,hh,mi).getTime();
  log.push({d:selDay,h,n,plan:pl>0?pl:r,real:r,ext:[],ok:$('mOk').checked,manual:true,segs:[[st,st+r*60000]]});
  store('log',log);closeModal();renderLog();
}
function openEntry(i){const e=log[i];if(!e)return;
  const [y,m,d]=e.d.split('-').map(Number),fecha=new Date(y,m-1,d).toLocaleDateString('es-MX',{weekday:'long',day:'numeric',month:'long'});
  const dur=(e.ext||[]).filter(x=>x.note),post=e.post||[];
  const f=ts=>{const x=new Date(ts);return x.toLocaleDateString('es-MX',{day:'numeric',month:'short'})+' '+pad(x.getHours())+':'+pad(x.getMinutes())};
  modal(`<div class="detail"><h1 style="font-size:24px">${esc(e.n)}</h1><div class="muted" style="text-transform:capitalize">${fecha} · ${e.h}</div>
  <div class="meta" style="margin-top:6px">🕒 ${segsOf(e).length>1?'Sesiones: ':''}${segTxt(e)}</div><div class="meta" style="margin-top:4px">Planeado ${fmtMin(e.plan)} · Real ${fmtMin(e.real)}${e.ext&&e.ext.length?` · ${e.ext.length} extensión${e.ext.length>1?'es':''}`:''}</div>
  <h3>📝 Notas durante la actividad</h3>
  ${dur.length?dur.map(x=>`<div class="note"><div class="nh">Al pedir +${x.min} min${x.pct!=null?` · faltaba ${x.pct}%`:''}</div>${esc(x.note).replace(/\n/g,'<br>')}</div>`).join(''):'<div class="muted" style="font-size:14px">Sin notas</div>'}
  <h3>🗒️ Notas después</h3>
  ${post.length?post.map((x,k)=>`<div class="note post"><div class="nh">${f(x.ts)}<button onclick="delPost(${i},${k})">✕</button></div>${esc(x.txt).replace(/\n/g,'<br>')}</div>`).join(''):'<div class="muted" style="font-size:14px">Aún no hay notas</div>'}
  <textarea id="pNote" rows="3" placeholder="Agrega una nota o aprendizaje…" style="margin-top:10px"></textarea>
  <div class="row"><button class="btn gray" onclick="closeModal()">Cerrar</button><button class="btn" onclick="addPost(${i})">＋ Agregar nota</button></div></div>`);
}
function addPost(i){const t=$('pNote').value.trim();if(!t){$('pNote').style.borderColor='#ff3b30';return}
  const e=log[i];e.post=(e.post||[]).concat({ts:Date.now(),txt:t});store('log',log);renderLog();openEntry(i)}
function delPost(i,k){const e=log[i];if(!e||!e.post)return;e.post.splice(k,1);if(!e.post.length)delete e.post;store('log',log);renderLog();openEntry(i)}
function rm(i){const e=log[i];if(!e)return;modal(`<h1>¿Borrar registro?</h1><div class="muted">${esc(e.n)} · ${e.h}. También se borran sus notas.</div><div class="row"><button class="btn gray" onclick="closeModal()">Cancelar</button><button class="btn red" onclick="closeModal();log.splice(${i},1);store('log',log);renderLog();renderAct()">Borrar</button></div>`)}
function confirmDel(){return true}
function stats(){const s={};log.filter(e=>e.ok).forEach(e=>{const k=e.n.toLowerCase();s[k]=s[k]||{n:e.n,c:0,sum:0,plan:0,min:1e9,max:0};const o=s[k];o.c++;o.sum+=e.real;o.plan+=e.plan;o.min=Math.min(o.min,e.real);o.max=Math.max(o.max,e.real)});
  Object.values(s).forEach(o=>{o.avg=o.sum/o.c;o.pavg=o.plan/o.c});return s}
function renderAct(){
  const s=Object.values(stats()).sort((a,b)=>b.c-a.c);
  $('actView').innerHTML=s.length?s.map(o=>{const r=o.avg/o.pavg;return`<div class="entry"><div class="top"><b>${esc(o.n)}</b><span class="muted">${o.c} ${o.c>1?'veces':'vez'}</span></div>
  <div class="meta">Promedio real <b style="color:#fff">${fmtMin(o.avg)}</b> · planeabas ${fmtMin(o.pavg)}</div>
  <div class="meta">Rango ${fmtMin(o.min)} – ${fmtMin(o.max)} · <span class="${r>1.05?'over':'under'}">${r>1.05?'tardas '+Math.round((r-1)*100)+'% más de lo que estimas':r<0.95?'terminas '+Math.round((1-r)*100)+'% antes':'estimas bien'}</span></div></div>`}).join(''):'<div class="empty">Aún no hay registros</div>';
}

function exportData(){
  const data=JSON.stringify({app:'temporizador',v:2,plans,log});
  const blob=new Blob([data],{type:'application/json'}),name='temporizador-'+dkey(new Date())+'.json';
  try{const f=new File([blob],name,{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f]}).catch(()=>{});return}}catch(e){}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();
}
function importData(inp){
  const f=inp.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.log))throw 0;
    const seen=new Set(log.map(e=>e.d+e.h+e.n));let n=0;d.log.forEach(e=>{if(!seen.has(e.d+e.h+e.n)){log.push(e);n++}});
    if(d.plans&&typeof d.plans==='object')Object.keys(d.plans).forEach(k=>{if(d.plans[k]&&d.plans[k].length)plans[k]=d.plans[k]});else if(Array.isArray(d.acts)&&d.acts.length)plans[dkey(new Date())]=d.acts;
    setPlanDay(planDay);store('log',log);store('plans',plans);render();renderLog();renderAct();
    modal(`<h1>Importado ✅</h1><div class="muted">${n} registros nuevos y tu plan del día.</div><div class="row"><button class="btn" onclick="closeModal()">OK</button></div>`)}
  catch(e){modal(`<h1>Archivo no válido</h1><div class="row"><button class="btn" onclick="closeModal()">OK</button></div>`)}inp.value=''};
  r.readAsText(f);
}

/* ---- Sincronización con Firebase ---- */
const fbConfig={apiKey:"AIzaSyBjd6EOuM9VtEodZ7GtEeGY1KG66Umwzgo",authDomain:"temporizador-de-actividades.firebaseapp.com",projectId:"temporizador-de-actividades",storageBucket:"temporizador-de-actividades.firebasestorage.app",messagingSenderId:"150673495434",appId:"1:150673495434:web:468eb73e3bfde86f77a473"};
let fbAuth=null,fbDb=null,user=null,unsub=null,syncT=null,syncState='off',applying=false;
const keyOf=e=>e.d+'|'+e.h+'|'+e.n;
function mergeLogs(a,b){const m=new Map();a.concat(b).forEach(e=>m.set(keyOf(e),e));return [...m.values()]}
function setSync(st){syncState=st;drawSync()}
function drawSync(){
  let h;
  if(!fbAuth)h='<div class="dot err"></div><span>Sin conexión a la nube</span>';
  else if(!user)h='<div class="dot"></div><span>Solo en este dispositivo</span><button onclick="login()">Iniciar sesión con Google</button>';
  else{const t={ok:'Sincronizado',busy:'Guardando…',err:'Error al sincronizar'}[syncState]||'Conectando…';
    h=`<div class="dot ${syncState}"></div><span>☁︎ ${t} · ${esc(user.email||'')}</span><button class="lnk" onclick="logout()">Salir</button>`}
  ['syncBar1','syncBar2'].forEach(id=>{const el=$(id);if(el)el.innerHTML=h});
}
function queueSync(){if(!user||applying)return;setSync('busy');clearTimeout(syncT);syncT=setTimeout(pushSync,800)}
function pushSync(){if(!user)return;fbDb.collection('users').doc(user.uid).set({plans,log,brk,acts:plans[dkey(new Date())]||[],updated:Date.now()}).then(()=>setSync('ok')).catch(e=>{console.error(e);setSync('err')})}
function applyRemote(d){applying=true;
  if(d.plans&&typeof d.plans==='object')plans=d.plans;else if(Array.isArray(d.acts)){plans={...plans};if(d.acts.length)plans[dkey(new Date())]=d.acts}
  log=d.log||[];if(typeof d.brk==='number'){brk=d.brk;try{localStorage.setItem('brk',JSON.stringify(brk))}catch(e){}}setPlanDay(planDay);
  try{localStorage.setItem('plans',JSON.stringify(plans));localStorage.setItem('log',JSON.stringify(log))}catch(e){}applying=false;
  render();if($('s2').classList.contains('on')){renderLog();renderAct()}}
async function onLogin(u){
  user=u;if(unsub){unsub();unsub=null}
  if(!u){setSync('off');return}
  setSync('busy');
  try{
    const ref=fbDb.collection('users').doc(u.uid),snap=await ref.get();
    if(snap.exists){const d=snap.data();
      const rp=(d.plans&&typeof d.plans==='object')?{...d.plans}:{};
      if(!d.plans&&d.acts&&d.acts.length)rp[dkey(new Date())]=d.acts;
      Object.keys(plans).forEach(k=>{if(!(rp[k]&&rp[k].length))rp[k]=plans[k]});
      applyRemote({plans:rp,log:mergeLogs(d.log||[],log)});
      await ref.set({plans,log,acts:plans[dkey(new Date())]||[],updated:Date.now()});
    }else await ref.set({plans,log,acts:plans[dkey(new Date())]||[],updated:Date.now()});
    setSync('ok');
    unsub=ref.onSnapshot(s=>{if(!s.exists||s.metadata.hasPendingWrites)return;applyRemote(s.data());setSync('ok')},e=>{console.error(e);setSync('err')});
  }catch(e){console.error(e);setSync('err')}
}
function login(){const p=new firebase.auth.GoogleAuthProvider();p.setCustomParameters({prompt:'select_account'});
  fbAuth.signInWithPopup(p).catch(e=>{if(e&&(e.code==='auth/popup-blocked'||e.code==='auth/operation-not-supported-in-this-environment'))fbAuth.signInWithRedirect(p);else if(e&&e.code!=='auth/popup-closed-by-user'&&e.code!=='auth/cancelled-popup-request')modal(`<h1>No se pudo iniciar sesión</h1><div class="muted">${esc(e.message||e.code||'')}</div><div class="row"><button class="btn" onclick="closeModal()">OK</button></div>`)})}
function logout(){fbAuth.signOut()}
try{
  firebase.initializeApp(fbConfig);fbAuth=firebase.auth();fbDb=firebase.firestore();
  fbAuth.getRedirectResult().catch(()=>{});
  fbAuth.onAuthStateChanged(onLogin);
}catch(e){console.error(e)}
drawSync();
const APP_VER=34;
async function latestVer(){
  const r=await fetch(location.pathname+'?check='+Date.now(),{cache:'no-store'});const t=await r.text();
  const m=t.match(/const APP_VER=(\d+)/);return m?+m[1]:0;
}
function doUpdate(v){if($('run').classList.contains('on'))saveRun();location.replace(location.pathname+'?v='+v+'&t='+Date.now())}
async function checkUpdate(manual){
  const b=$('updBtn');if(manual)b.textContent='⟳ Buscando…';
  try{const v=await latestVer();
    if(v>APP_VER){$('updBox').innerHTML=`<div class="upd"><span>Hay una versión nueva: <b>v${v}</b></span><button onclick="doUpdate(${v})">Actualizar</button></div>`;
      if(manual)doUpdate(v);else b.textContent=`⟳ Actualizar a la v${v}`;}
    else{$('updBox').innerHTML='';if(manual){b.textContent='✓ Ya tienes la versión más nueva (v'+APP_VER+')';setTimeout(()=>b.textContent='⟳ Buscar actualización (tienes la v'+APP_VER+')',3000)}}
  }catch(e){if(manual){b.textContent='Sin conexión, intenta de nuevo';setTimeout(()=>b.textContent='⟳ Buscar actualización (tienes la v'+APP_VER+')',3000)}}
}
if(/[?&](v|t)=/.test(location.search))history.replaceState(null,'',location.pathname);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkUpdate(false)});
initPlans();render();prev();setTimeout(checkRun,300);setTimeout(()=>checkUpdate(false),1500);
</script>
