<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Temporizador del día</title>
<link rel="stylesheet" href="css/app.css?v=133">
</head>
<body>

<section id="s0" class="on">
  <h2>Temporizador <span style="color:#444;font-size:12px">v133</span></h2>
  <div id="updBox"></div>
  <button id="avisoBtn" class="btn gray" style="width:100%;margin-bottom:8px;display:none" onclick="avisoOn()">🔔 Activar avisos si me quedo parado</button>
  <div class="preview" id="tPrev">20:00</div>
  <div class="presets">
    <button onclick="setT(5)">5</button><button onclick="setT(10)">10</button>
    <button onclick="setT(15)">15</button><button onclick="setT(20)">20</button>
    <button onclick="setT(30)">30</button><button onclick="setT(45)">45</button>
    <button onclick="setT(60)">60</button>
  </div>
  <div class="row">
    <input class="name" id="tName" placeholder="Nombre (opcional)">
    <input class="min" id="tMin" type="number" inputmode="numeric" value="20" oninput="prev()">
  </div>
  <button class="btn big" onclick="startSingle()">▶ Iniciar</button>
  <button class="recbtn" onclick="recList()">🔁 Actividades recurrentes</button>
  <button class="restbtn" onclick="startRest()">☕ Me merezco un descanso <small>10 min</small></button>
  <div id="qbList"></div>
  <button class="linkbtn" id="updBtn" onclick="checkUpdate(true)">⟳ Buscar actualización</button>
</section>

<section id="s1"><aside id="blBox" class="deskonly"></aside><div class="s1main">
  <div class="ptrow"><h2 id="planTitle">Plan de hoy</h2><button id="mmBtn" class="mmbtn" onclick="mmToggle()" title="Minuto a minuto">MM</button><div class="sync" id="syncBar1"></div></div>
  <div class="topg"><div class="topl">
  <div class="daynav"><button onclick="moveDay(-1)">‹</button><label><span id="planDate"></span><input type="date" id="planPick" onchange="pickDay(this.value)"></label><button onclick="moveDay(1)">›</button></div>
  <div class="addg">
    <input class="name" id="aName" placeholder="Actividad" list="known">
    <input type="time" id="aTime" title="Hora programada (opcional)">
    <button class="btn" onclick="add()">+</button>
    <button class="hidebtn" id="hideBtn" onclick="toggleHideDone()"></button>
    <input class="min" id="aMin" type="number" inputmode="numeric" placeholder="-- min" title="Duración en minutos">
    <span></span>
  </div></div><button class="mcal" id="mcal" onclick="newEvent()" title="Programar una actividad en otra fecha"></button></div>
  <datalist id="known"></datalist>
  <div class="muted" id="hint" style="margin:-4px 0 10px;font-size:14px"></div>
  <ul id="list"></ul>
  <div class="muted" id="total"></div>
  <div class="brkset">☕ Descanso entre actividades <input class="min" id="brkMin" type="number" inputmode="numeric" min="0" onchange="setBrk(this.value)"> min</div>
  <div id="calBox"></div>
  <button class="btn big" onclick="startList()">▶ Empezar</button>
  <div id="copyBox"></div>
  <button class="linkbtn" onclick="recoverForm()">↺ ¿Se cerró la app? Recuperar actividad en curso</button>
</div><aside id="dayPrev" class="deskonly"></aside>
</section>

<section id="s5">
  <div class="blhead m"><h2>📥 Backlog</h2><a class="picum" href="https://airtable.com/appOfREf0mVgyWXXO/tblZVWZynzvKPNAHg/viwFGlnNqaotDFN3z?blocks=hide" target="_blank" rel="noopener" title="Pendientes de PICUM en Airtable"><img src="picum.png" alt="PICUM"></a></div>
  <div class="row"><input class="name" id="bmN" placeholder="Nueva tarea"><input class="min" id="bmM" type="number" inputmode="numeric" placeholder="-- min"><button class="btn" onclick="bmAdd()">+</button></div>
  <ul id="bmList"></ul><div class="blfoot" id="bmFoot"></div>
  <div class="wkz" id="bmWk" style="max-height:none"></div>
</section>
<section id="s4">
  <div class="wvtop"><h2>Vista panorámica</h2>
    <div class="seg wvseg"><button id="wvW" class="on" onclick="wvSet('sem')">Semanal</button><button id="wvM" onclick="wvSet('mes')">Mensual</button></div>
    <div class="calhead wvnav"><button onclick="wvMove(-1)">‹</button><b id="wvLabel"></b><button onclick="wvMove(1)">›</button><button class="wvtoday" onclick="wvToday()">Hoy</button></div><label class="wvhide"><input type="checkbox" id="wvHide" onchange="wvHideSet(this.checked)"> Ocultar las que ya hice</label></div>
  <div class="muted wvhint" id="wvHint"></div>
  <div id="wvBody"></div>
</section>
<section id="s3">
  <h2>Reportes</h2>
  <div class="seg"><button id="rpD" class="on" onclick="rpSet('dia')">Día</button><button id="rpW" onclick="rpSet('sem')">Semanal</button><button id="rpM" onclick="rpSet('mes')">Mensual</button></div>
  <div class="calhead"><button onclick="rpMove(-1)">‹</button><b id="rpLabel"></b><button onclick="rpMove(1)">›</button></div>
  <div id="rpBody"></div>
</section>
<section id="s2">
  <h2>Registro</h2>
  <div class="sync" id="syncBar2"></div>
  <div class="seg"><button id="vCal" class="on" onclick="view('cal')">Por día</button><button id="vAct" onclick="view('act')">Por actividad</button></div>
  <div id="calView"><div class="rgL">
    <div class="calhead"><button onclick="month(-1)">‹</button><b id="mLabel"></b><button onclick="month(1)">›</button></div>
    <div class="grid" id="grid"></div>
    <button class="btn gray rgb" style="width:100%;margin-top:8px" onclick="recoverForm()">↺ ¿Se borró tu actividad? Recuperarla</button>
    <div class="dnote"><div class="dnh"><b>📝 Notas del día</b><span id="dnSt"></span></div>
      <textarea id="dnTxt" placeholder="¿Cómo te fue hoy? Lo que sentiste, lo que aprendiste, lo que te frenó…" oninput="dnInput()" onblur="dnFlush()"></textarea></div>
    </div><div class="rgM">
    <h3 id="dayTitle"></h3>
    <div id="dayMet"></div>
    <div id="dayList"></div>
    </div><div class="rgR">
    <div id="dayTl"></div>
  </div></div>
  <div id="actView" style="display:none"></div>
  <h3>Respaldo</h3>
  <div class="muted" style="font-size:14px;margin-bottom:8px">Pasa tu plan y tu registro a otro dispositivo, o guarda un respaldo.</div>
  <div class="row"><button class="btn gray" style="flex:1" onclick="exportData()">⬇︎ Exportar</button><button class="btn gray" style="flex:1" onclick="$('imp').click()">⬆︎ Importar</button></div>
  <input type="file" id="imp" accept=".json,application/json" style="display:none" onchange="importData(this)">
</section>

<nav>
  <button id="n2" onclick="tab(2)"><span>📓</span>Registro</button>
  <button id="n0" class="on" onclick="tab(0)"><span>⏱</span>Temporizador</button>
  <div class="navpair"><button id="n5" onclick="tab(5)"><span>📥</span>Backlog</button><button id="n1" onclick="tab(1)"><span>📋</span>Actividades</button></div>
  <button id="n4" onclick="tab(4)" style="display:none"><span>📅</span><b class="lg">Vista panorámica</b><b class="sm">Panorámica</b></button>
  <button id="n3" onclick="tab(3)"><span>📊</span>Reportes</button>
</nav>

<div id="brkBar" class="brkbar" onclick="restoreRunView()" style="display:none"></div><div id="bar2" class="bar2" style="display:none"></div>
<div id="run"><div id="runTop"></div><div id="ver" style="position:absolute;left:50%;bottom:4px;transform:translateX(-50%);color:#333;font-size:11px">v133</div>
  <div class="side">
    <button id="p5" class="p5" onclick="plus5()">+5<small>min</small></button>
    <button onclick="pause()"><svg viewBox="0 0 24 24"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg></button>
    <button id="ntRun" class="ntrun" onclick="runNote()">📝<small>Nota</small></button>
    <button id="minBtn" class="minbtn" onclick="minimizeRun()" style="display:none">⌄<small>Usar app</small></button>
  </div>
  <div class="mid">
    <div id="clock">00:00</div>
    <div class="lbl"><div id="label"></div>
    <div id="sub"></div><div id="brkAct" class="brkact" style="display:none"><button class="ba skip" onclick="skipBreak()">⏭ Saltar descanso</button><button class="ba rest" onclick="restChosen()">☕ Descansar</button></div><button class="minib ntmid" onclick="runNote()">📝 Nota</button><button id="endBtn" class="endbtn" onclick="endAct()">✓ Terminar actividad</button></div>
  </div>
  <div class="side">
    <div class="exits"><button class="exb ex1" onclick="exitKeep()" title="Salir y continuar" aria-label="Salir y continuar"><svg viewBox="0 0 24 24"><path d="M14 4H6a1 1 0 0 0-1 1v14a1 1 0 0 0 1 1h8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M11 12h10M17.5 8.5 21 12l-3.5 3.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><i>▶</i></button><button class="exb ex2" onclick="stop()" title="Salir y pausar" aria-label="Salir y pausar"><svg viewBox="0 0 24 24"><path d="M14 4H6a1 1 0 0 0-1 1v14a1 1 0 0 0 1 1h8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M11 12h10M17.5 8.5 21 12l-3.5 3.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><i>❚❚</i></button></div>
    <button onclick="play()"><svg viewBox="0 0 24 24"><path d="M7 4v16l13-8z"/></svg></button>
  </div>
</div>

<div id="modal"><div class="card" id="mCard"></div></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>const APP_VER=133;</script>
<script src="js/core.js?v=133"></script>
<script src="js/actividades.js?v=133"></script>
<script src="js/temporizador.js?v=133"></script>
<script src="js/recurrentes.js?v=133"></script>
<script src="js/minuto-a-minuto.js?v=133"></script>
<script src="js/backlog.js?v=133"></script>
<script src="js/notas.js?v=133"></script>
<script src="js/panoramica.js?v=133"></script>
<script src="js/nueva-actividad.js?v=133"></script>
<script src="js/uso.js?v=133"></script>
<script src="js/metricas.js?v=133"></script>
<script src="js/reportes.js?v=133"></script>
<script src="js/registro.js?v=133"></script>
<script src="js/sync.js?v=133"></script>
<script src="js/rapidos.js?v=133"></script>
<script src="js/aviso.js?v=133"></script>
<script src="js/arranque.js?v=133"></script>
</body>
</html>
