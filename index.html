<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script>
const $=id=>document.getElementById(id);
const load=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}};
const store=(k,v)=>{if(k==='brk'||k==='recs'||k==='bl'||k==='notes'){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){};return queueSync()}if(k==='acts'){plans[planDay]=acts;cleanPlans();k='plans';v=plans}try{localStorage.setItem(k,JSON.stringify(v))}catch(e){};if(k==='plans'||k==='log')queueSync()};
let notes=load('notes',[]),bl=load('bl',[]),recs=load('recs',[]),log=load('log',[]),plans={},acts=[],planDay='';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const dkey=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
function initPlans(){
  plans=load('plans',null);
  if(!plans||typeof plans!=='object'){plans={};const old=load('acts',[]);if(old.length)plans[dkey(new Date())]=old}
  fixData();if(carryPaused())try{localStorage.setItem('plans',JSON.stringify(plans))}catch(e){}
  setPlanDay(dkey(new Date()));
}
/* Las actividades pausadas de días anteriores pasan solas al plan de hoy */
function carryPaused(){const t=dkey(new Date());let moved=[];
  Object.keys(plans).forEach(k=>{if(k>=t)return;const keep=[];(plans[k]||[]).forEach(a=>{if(a.prog&&!a.done)moved.push(a);else keep.push(a)});plans[k]=keep;if(!keep.length)delete plans[k]});
  if(!moved.length)return false;plans[t]=moved.concat((plans[t]||[]).filter(a=>!moved.some(m=>m.id===a.id)));return true}
function cleanPlans(){Object.keys(plans).forEach(k=>{if(!plans[k]||!plans[k].length)delete plans[k]})}
function setPlanDay(k){planDay=k;acts=plans[k]?plans[k]:[]}
function shiftDay(k,n){const [y,m,d]=k.split('-').map(Number);return dkey(new Date(y,m-1,d+n))}
function dayName(k){const t=dkey(new Date());if(k===t)return'hoy';if(k===shiftDay(t,1))return'mañana';if(k===shiftDay(t,2))return'pasado mañana';if(k===shiftDay(t,-1))return'ayer';
  const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d).toLocaleDateString('es-MX',{weekday:'short',day:'numeric',month:'short'})}
function moveDay(n){setPlanDay(shiftDay(planDay,n));render()}
function pickDay(v){if(v){setPlanDay(v);render()}}
const fmtMin=m=>{m=Math.round(m);return m>=60?Math.floor(m/60)+'h '+(m%60)+'min':m+' min'};

function tab(i){[0,1,2,3,4].forEach(k=>{$('s'+k).classList.toggle('on',k===i);$('n'+k).classList.toggle('on',k===i)});if(i===2)renderLog();if(i===1)render();if(i===3)renderRep();if(i===4)renderWeek()}

/* ---- Temporizador simple ---- */
function setT(m){$('tMin').value=m;prev()}
function prev(){const m=parseFloat($('tMin').value)||0;$('tPrev').textContent=pad(Math.floor(m))+':'+pad(Math.round((m%1)*60))}

/* ---- Plan ---- */
function render(){
  materialize(planDay);wkClean();
  {const qk=a=>a.quick&&!a.prog;if(acts.some((a,i)=>i>0&&qk(a)&&!qk(acts[i-1]))){const o=[...acts.filter(qk),...acts.filter(a=>!qk(a))];acts.splice(0,acts.length,...o);store('acts',acts)}}
  acts.forEach(a=>{if(!a.id)a.id=uid()});
  const ncnt={};notes.forEach(n=>{if(!n.del&&n.act)ncnt[n.act]=(ncnt[n.act]||0)+1});
  const nDone=acts.filter(a=>a.done).length,hb=$('hideBtn');if(hb){hb.innerHTML=hideDone?`👁<span class="lg"> Mostrar terminadas</span>${nDone?' ('+nDone+')':''}`:'🙈<span class="lg"> Ocultar terminadas</span>';hb.title=hideDone?'Mostrar terminadas':'Ocultar terminadas';hb.classList.toggle('on',hideDone)}
  $('list').innerHTML=acts.length?acts.map((a,i)=>hideDone&&a.done?'':`<li data-i="${i}" class="${a.done?'done':''}"><button class="chk" onclick="toggleDone(${i})">${a.done?'✓':''}</button>${a.done?'':`<span class="tchip${a.t?'':' none'}" onclick="editTime(${i})">${a.t?fmt12(a.t):'🕒'}</span>`}<span class="n">${a.rid?'<span class="rico">🔁</span>':''}${esc(a.n)}</span><button class="ntb${ncnt[a.n]?' has':''}" onclick="notesOpen(${i})" title="Notas">📝${ncnt[a.n]?`<i>${ncnt[a.n]}</i>`:''}</button>${a.prog&&!a.done?`<span class="t tprog" onclick="editT(${i})"><span>Llevas ${fmtMin(a.prog.el/60)}</span><span>Quedan ${fmtMin(Math.max(0,a.prog.rem)/60)}</span></span>`:`<span class="t${a.quick?' quick':''}" onclick="${a.done?'':`editT(${i})`}">${a.quick?'⚡ <5 min':a.m+' min'}</span>`}${a.done||(a.quick&&!a.prog)?'':`<button class="playb${a.prog?' paused':''}" onclick="resumeItem(${i})" aria-label="Iniciar"><svg viewBox="0 0 24 24"><path d="M7 4v16l13-8z"/></svg></button>`}<button class="delb" onclick="del(${i})">✕</button></li>`).join('')+(hideDone&&nDone===acts.length?'<div class="empty">Todo lo de este día está terminado 🎉</div>':''):'<div class="empty">Agrega tus actividades</div>';
  const dn=dayName(planDay),[py,pm,pd]=planDay.split('-').map(Number);
  $('planTitle').textContent=/^(hoy|mañana|pasado mañana|ayer)$/.test(dn)?'Plan de '+dn:'Plan del '+dn;
  $('planDate').textContent=new Date(py,pm-1,pd).toLocaleDateString('es-MX',{weekday:'long',day:'numeric',month:'long'});
  $('planPick').value=planDay;$('brkMin').value=brk;
  const nT=acts.filter(a=>a.t&&!a.done).length;
  $('calBox').innerHTML=nT?`<button class="calbtn" onclick="toCalendar()">📅 Agregar ${nT>1?`las ${nT} programadas`:'la programada'} a mi Calendario</button><div class="muted" style="font-size:13px;text-align:center">Con alerta 30 min antes, aunque la app esté cerrada.</div>`:'';
  $('copyBox').innerHTML=acts.length?`<div class="copyrow"><button onclick="copyPlan(1)">${acts.some(a=>a.done)?'Copiar pendientes al día siguiente':'Copiar al día siguiente'}</button><button onclick="clearPlan()">Vaciar este día</button></div>`:'';
  const pend=acts.filter(a=>!a.done),t=pend.reduce((s,a)=>s+(a.prog?Math.max(0,a.prog.rem)/60:a.m),0),nd=acts.length-pend.length;
  $('total').textContent=!acts.length?'':nd?`✓ ${nd} de ${acts.length} hechas · Pendiente: ${fmtMin(t)}`:(acts.some(a=>a.prog)?'Pendiente: ':'Total planeado: ')+fmtMin(t);
  const names=[...new Set(log.map(e=>e.n))];
  $('known').innerHTML=names.map(n=>`<option value="${esc(n)}">`).join('');
  renderPrev();renderBl();drawMcal();
}
$('aName').addEventListener('input',()=>{
  const s=stats()[$('aName').value.trim().toLowerCase()];
  if(s){$('hint').textContent=`Histórico: promedio real ${fmtMin(s.avg)} (${s.c} veces) · sin minutos = tarea rápida`}
  else $('hint').textContent='';
});
function add(){const n=$('aName').value.trim();let m=parseFloat($('aMin').value);if(!n)return;const tm=$('aTime').value;if(!(m>0)&&tm)m=30;const q=!(m>0);acts.push({n,m:q?5:m,id:uid(),...(q?{quick:true}:{}),...(tm&&!q?{t:tm}:{})});$('aName').value='';$('aMin').value='';$('aTime').value='';$('hint').textContent='';store('acts',acts);render()}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function toggleDone(i){const a=acts[i];if(!a)return;
  if(a.done){a.done=false;if(a.cid){log=log.filter(e=>e.cid!==a.cid);delete a.cid;store('log',log)}store('acts',acts);render();return}
  if(a.quick&&!a.prog){const e=Date.now(),st=e-5*60000,sd=new Date(st),cid=a.id+'|'+e;
    log.push({d:dkey(sd),h:pad(sd.getHours())+':'+pad(sd.getMinutes()),n:a.n,plan:5,real:5,ext:[],ok:true,quick:true,segs:[{s:st,e}],cid});
    a.done=true;a.cid=cid;store('log',log);store('acts',acts);render();toast(`⚡ Hecha: ${esc(a.n)} · ${hm(e)}`);return}
  const pr=a.prog,now=Date.now(),real=pr?Math.max(1,Math.round(pr.el/60)):a.m,st=pr&&pr.st?pr.st:now-real*60000,x=new Date(st);
  modal(`<h1>✓ Terminar actividad</h1><div class="muted">${esc(a.n)}</div>
  <div class="row" style="margin:0;gap:10px"><div style="flex:1"><label>Hora de inicio</label><input id="qdH" type="time" value="${pad(x.getHours())}:${pad(x.getMinutes())}"></div>
  <div style="flex:1"><label>Hora de terminación</label><input id="qdE" type="time"></div></div>
  <label>Tiempo real (min)</label><input id="qdR" type="number" inputmode="decimal" value="${real}" style="width:100%">
  <div class="muted" style="font-size:13px;margin-top:6px">Planeado: ${fmtMin(a.m)}. Se guarda en tu registro.</div>
  <div class="row"><button class="btn gray" onclick="closeModal()">Cancelar</button><button class="btn" style="background:#34c759" onclick="quickDone(${i},'${pad(x.getHours())}:${pad(x.getMinutes())}',${real})">✓ Terminada</button></div>
  <button class="linkbtn" style="padding:10px 0 0;color:#888" onclick="closeModal();acts[${i}].done=true;delete acts[${i}].prog;store('acts',acts);render()">Solo marcar, sin registrar</button>`);
  qdSync('r');$('qdH').addEventListener('input',()=>qdSync('r'));$('qdR').addEventListener('input',()=>qdSync('r'));$('qdE').addEventListener('input',()=>qdSync('e'))}
/* Inicio + tiempo real ⇄ hora de terminación */
function qdSync(src){const h=$('qdH').value;if(!h)return;const [hh,mi]=h.split(':').map(Number),st=hh*60+mi;
  if(src==='e'){const e=$('qdE').value;if(!e)return;const [eh,em]=e.split(':').map(Number);let d=eh*60+em-st;if(d<=0)d+=1440;$('qdR').value=d;$('qdR').style.borderColor=''}
  else{const r=parseFloat($('qdR').value);if(!(r>0))return;const t=Math.round(st+r)%1440;$('qdE').value=pad(Math.floor(t/60))+':'+pad(t%60)}}
function quickDone(i,h0,r0){const a=acts[i];if(!a)return closeModal();
  const h=$('qdH').value||h0,r=parseFloat($('qdR').value);if(!(r>0)){$('qdR').style.borderColor='#ff3b30';return}
  const pr=a.prog,t=new Date(),[hh,mi]=h.split(':').map(Number);let st=new Date(t.getFullYear(),t.getMonth(),t.getDate(),hh,mi).getTime();
  if(st>Date.now())st-=864e5;
  let segs=[{s:st,e:st+r*60000}];
  if(pr&&h===h0&&r===r0){const sg=normSegs(pr.segs).filter(x=>x.e!=null);if(sg.length)segs=sg}
  const sd=new Date(segs[0].s),cid=a.id+'|'+Date.now();
  log.push({d:dkey(sd),h:pad(sd.getHours())+':'+pad(sd.getMinutes()),n:a.n,plan:a.m,real:r,ext:pr?(pr.ext||[]):[],ok:true,segs,cid});
  a.done=true;a.cid=cid;delete a.prog;store('log',log);store('acts',acts);closeModal();render();
  toast(`Guardada en tu registro: ${esc(a.n)} · ${fmtMin(r)}`)}
function markDone(id){let hit=false;Object.values(plans).forEach(l=>l.forEach(a=>{if(a.id===id){a.done=true;delete a.prog;hit=true}}));if(hit){store('plans',plans);render()}}
function copyPlan(n){const k=shiftDay(planDay,n),src=acts.filter(a=>!a.done),cp=src.map(a=>({n:a.n,m:a.m,id:uid(),...(a.prog?{prog:a.prog}:{})}));plans[k]=(plans[k]||[]).concat(cp);store('plans',plans);
  modal(`<h1>Copiado ✅</h1><div class="muted">Se agregaron ${cp.length} actividades al plan de ${dayName(k)}.</div><div class="row"><button class="btn gray" onclick="closeModal()">Quedarme aquí</button><button class="btn" onclick="closeModal();setPlanDay('${k}');render()">Ir a ${dayName(k)}</button></div>`)}
function clearPlan(){modal(`<h1>¿Vaciar el plan?</h1><div class="muted">Se borran las actividades del plan de ${dayName(planDay)}. Tu registro no se toca.</div><div class="row"><button class="btn gray" onclick="closeModal()">Cancelar</button><button class="btn red" onclick="closeModal();acts=[];store('acts',acts);render()">Vaciar</button></div>`)}
/* ---- Mover una actividad a otro día (deslizando) ---- */
let lastMove=null,toastT=null;
function sendTo(i,k){const a=acts[i];if(!a||k===planDay)return;const from=planDay;if(a.rid&&(a.rk||from)===from)recSkip(a.rid,from);
  acts.splice(i,1);store('acts',acts);plans[k]=(plans[k]||[]).concat(a);store('plans',plans);render();
  lastMove={a,i,from,k};toast(`Movida a ${dayName(k)}: ${esc(a.n)}`,'Deshacer','undoMove()')}
function undoMove(){const m=lastMove;if(!m)return;lastMove=null;plans[m.k]=(plans[m.k]||[]).filter(x=>x!==m.a&&x.id!==m.a.id);
  plans[m.from]=plans[m.from]||[];plans[m.from].splice(Math.min(m.i,plans[m.from].length),0,m.a);store('plans',plans);setPlanDay(planDay);render();hideToast()}
function pickDayFor(i){const a=acts[i];if(!a)return;const t=dkey(new Date());
  const opts=[t,shiftDay(t,1),shiftDay(t,2)].filter(k=>k!==planDay);
  modal(`<h1>¿A qué día?</h1><div class="muted">${esc(a.n)}</div>
  <div class="picklist">${opts.map(k=>`<button onclick="closeModal();sendTo(${i},'${k}')"><span style="text-transform:capitalize">${dayName(k)}</span><span class="muted">${(()=>{const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d).toLocaleDateString('es-MX',{weekday:'short',day:'numeric',month:'short'})})()}</span></button>`).join('')}</div>
  ${isDesk()?`<button class="calbtn" style="margin-top:8px" onclick="closeModal();toBacklog(${i})">📥 Mandar al Backlog</button>`:''}
  <label>Otra fecha</label><input type="date" id="pkD" value="${shiftDay(planDay,1)}">
  <div class="row"><button class="btn gray" onclick="closeModal()">Cancelar</button><button class="btn" onclick="const v=$('pkD').value;if(v){closeModal();sendTo(${i},v)}">Mover</button></div>`)}
function toast(msg,btn,fn){let t=$('toast');if(!t){t=document.createElement('div');t.id='toast';document.body.appendChild(t)}
  t.innerHTML=`<span>${msg}</span>${btn?`<button onclick="${fn}">${btn}</button>`:''}`;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(hideToast,5000)}
function hideToast(){const t=$('toast');if(t)t.classList.remove('on')}
function del(i){const a=acts[i];if(a&&a.rid)recSkip(a.rid,a.rk||planDay);acts.splice(i,1);store('acts',acts);render()}
function fmt12(t){let [h,m]=t.split(':').map(Number);const ap=h>=12?'pm':'am';h=h%12||12;return h+':'+pad(m)+' '+ap}
function editTime(i){editAct(i,'t')}
function editAct(i,focus){const a=acts[i];
  modal(`<h1>Editar actividad</h1>
  <label>Actividad</label><input id="eN" value="${esc(a.n)}">
  <div class="row" style="margin:0;gap:10px"><div style="flex:1"><label>Tiempo (min)</label><input id="eM" type="number" inputmode="decimal" value="${a.m}"></div>
  <div style="flex:1"><label>⏰ Hora (opcional)</label><input id="eT" type="time" value="${a.t||''}"></div></div>
  ${a.t?`<button class="linkbtn" style="padding:8px 0;color:#ff453a" onclick="$('eT').value=''">Quitar hora</button>`:''}
  <div class="row"><button class="btn gray" onclick="closeModal()">Cancelar</button><button class="btn" onclick="saveEdit(${i})">✓ Aceptar</button></div>`);
  setTimeout(()=>{const e=$(focus==='t'?'eT':'eM');if(e&&focus!=='t'){e.focus();e.select&&e.select()}},60);
}
function saveEdit(i){const a=acts[i];if(!a)return closeModal();
  const n=$('eN').value.trim(),m=parseFloat($('eM').value),t=$('eT').value;
  if(!n){$('eN').style.borderColor='#ff3b30';return}if(!(m>0)){$('eM').style.borderColor='#ff3b30';return}
  if(a.quick&&m!==a.m)delete a.quick;a.n=n;a.m=m;if(t){if(a.t!==t)delete a.warned30;a.t=t}else delete a.t;
  store('acts',acts);closeModal();render()}
function toCalendar(){
  const ev=acts.filter(a=>a.t&&!a.done);if(!ev.length)return;
  const d=planDay.replace(/-/g,''),st=(t,add)=>{const [y,mo,da]=planDay.split('-').map(Number),[h,m]=t.split(':').map(Number);const x=new Date(y,mo-1,da,h,m+(add||0));return x.getFullYear()+pad(x.getMonth()+1)+pad(x.getDate())+'T'+pad(x.getHours())+pad(x.getMinutes())+'00'};

function restoreRun(){
  const r=load('run',null);if(!r)return;

    if(left>0){$('run').classList.remove('brk');begin(miniSaved.total,miniSaved.remain);running=false;clearInterval(timer);startMiniAt(left);return}

    $('run').classList.remove('brk');if(remain<=0)cur.elapsed+=remain;begin(total,remain);return}
  remain-=gone;if(cur&&!inBreak)cur.elapsed+=gone;

const WD=['L','M','M','J','V','S','D'],WDN=['lunes','martes','miércoles','jueves','viernes','sábado','domingo'],NTH={1:'Primer',2:'Segundo',3:'Tercer',4:'Cuarto','-1':'Último'};

  if(add){if(k===planDay)acts=l;try{localStorage.setItem('plans',JSON.stringify(plans))}catch(e){}queueSync()}else if(!l.length)delete plans[k]}

function recTxt(r){let t=r.type==='week'?((r.days||[]).length===7?'Todos los días':(r.days||[]).length===5&&!r.days.includes(5)&&!r.days.includes(6)?'Lunes a viernes':'Cada '+(r.days||[]).map(i=>WDN[i]).join(', ')):r.type==='monthday'?`Día ${r.md} de cada mes`:`${NTH[r.nth]} ${WDN[r.wd]} de cada mes`;

  <div class="row"><button class="btn gray" onclick="closeModal()">Cancelar</button><button class="btn" onclick="wkNext()">Siguiente fin</button></div>`)}
function wkNext(){closeModal();const p=wkPend;wkPend=null;if(!p)return;wkForce=true;try{if(p.src==='plan'){const i=acts.findIndex(x=>x.id===p.id);if(i>=0)toWeekendPlan(i)}else toWeekendBl(p.id)}finally{wkForce=false}}
function wkUnlink(b){if(!b||!b.wk)return;const l=plans[b.wk.k];if(l){const j=l.findIndex(x=>x.id===b.wk.pid);if(j>=0&&!l[j].done)l.splice(j,1)}store('plans',plans)}
function wkClean(){const td=dkey(new Date());let ch=false;
  bl=bl.filter(b=>{if(!b.wk)return true;if(b.wk.k<=td){ch=true;return false}
    if(!(plans[b.wk.k]||[]).some(x=>x.id===b.wk.pid)){delete b.wk;ch=true}return true});
  if(ch)store('bl',bl)}
function toWeekendPlan(i){const a=acts[i];if(!a||a.done)return;if(!wkForce&&!wkPick())return wkFull({src:'plan',id:a.id});const sn=snap();if(a.rid&&(a.rk||planDay)===planDay)recSkip(a.rid,planDay);
  acts.splice(i,1);store('acts',acts);const {done,rid,rk,warned30,t,cid,...rest}=a;wkPlace(rest,null,sn)}
function toWeekendBl(id){const b=bl.find(x=>x.id===id);if(!b)return;if(!wkForce&&!wkPick())return wkFull({src:'bl',id});const sn=snap();wkUnlink(b);const {c,wk,id:_,...rest}=b;wkPlace(rest,b,sn)}
function wkPlace(rest,b,sn){const k=wkPick(wkForce);plans[k]=plans[k]||[];const it={...rest,id:uid()};delete it.c;delete it.wk;plans[k].push(it);
  if(b)b.wk={k,pid:it.id};else bl.push({...rest,id:uid(),c:Date.now(),wk:{k,pid:it.id}});
  store('plans',plans);store('bl',bl);setPlanDay(planDay);render();lastSnap=sn;
  toast(`🏖️ ${esc(it.n)} → ${wkLbl(k)} (${wkCount(k)}/${WK_MAX})`,'Deshacer','undoSnap()')}

/* ===== Visualización semanal / mensual ===== */

function wvHideSet(v){wvHide=v;try{localStorage.setItem('wvHide',v?'1':'0')}catch(e){}renderWeek()}const WV_H0=5,WV_H1=24;
const wvMon=k=>{const d=kDate(k),w=(d.getDay()+6)%7;d.setDate(d.getDate()-w);return dkey(d)};
const WD_S=['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'],MES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
function wvSet(m){wvMode=m;$('wvW').classList.toggle('on',m==='sem');$('wvM').classList.toggle('on',m==='mes');renderWeek()}
function wvMove(n){const d=kDate(wvRef);if(wvMode==='sem')d.setDate(d.getDate()+7*n);else{d.setDate(1);d.setMonth(d.getMonth()+n)}wvRef=dkey(d);renderWeek()}
function wvToday(){wvRef=dkey(new Date());renderWeek()}
function wvItems(k){materialize(k);const l=plans[k]||[];return wvHide?l.filter(a=>!a.done):l}
function wvHourH(){return innerWidth<700?40:48}
function renderWeek(){const hb=$('wvHide');if(hb)hb.checked=wvHide;if(wvMode==='mes')return renderMonth();
  const H=wvHourH(),mon=wvMon(wvRef),days=[...Array(7)].map((_,i)=>shiftDay(mon,i)),td=dkey(new Date());
  const d0=kDate(days[0]),d6=kDate(days[6]);
  $('wvLabel').textContent=d0.getMonth()===d6.getMonth()?`${d0.getDate()} – ${d6.getDate()} de ${MES[d6.getMonth()]}`:`${d0.getDate()} ${MES[d0.getMonth()].slice(0,3)} – ${d6.getDate()} ${MES[d6.getMonth()].slice(0,3)}`;
  $('wvHint').textContent='Pica un espacio vacío para crear una actividad de 30 min a esa hora. Pica una actividad para editarla.'+(wvHide?'':' En gris: lo que registraste.');
  const totH=(WV_H1-WV_H0)*H,y=(h,m)=>((h-WV_H0)*60+m)/60*H;

  let lines='';for(let h=WV_H0;h<WV_H1;h++){lines+=`<div class="wkline" style="top:${y(h,0)}px"></div><div class="wkline half" style="top:${y(h,30)}px"></div>`}
  let planned=0,cnt=0;
  days.forEach((k,di)=>{const d=kDate(k),isT=k===td,items=wvItems(k);
    head+=`<div class="wkh${isT?' today':''}">${WD_S[di]}<b>${d.getDate()}</b></div>`;
    const untimed=items.map((a,i)=>({a,i})).filter(o=>!o.a.t);
    all+=`<div class="wkall" data-k="${k}">${untimed.map(o=>`<div class="wkchip${o.a.done?' done':''}${o.a.quick?' q':''}" onclick="event.stopPropagation();wvEdit('${k}','${o.a.id}')" title="${esc(o.a.n)}">${o.a.quick?'⚡ ':''}${esc(o.a.n)}</div>`).join('')}</div>`;
    items.forEach(a=>{if(!a.quick){planned+=+a.m||0;cnt++}});
    // registro (gris)
    let lg='';if(!wvHide)log.filter(e=>e.d===k||(e.segs||[]).some(sg=>dkey(new Date(sg.s))===k)).forEach(e=>(e.segs||[]).forEach(sg=>{if(sg.e==null)return;const s0=new Date(sg.s);if(dkey(s0)!==k)return;
      const top=Math.max(0,y(s0.getHours(),s0.getMinutes()+s0.getSeconds()/60)),ht=Math.max(6,(sg.e-sg.s)/60000/60*H);if(top>totH)return;
      lg+=`<div class="wklog" style="top:${top}px;height:${Math.min(ht,totH-top)}px">${ht>=16?esc(e.n):''}</div>`}));
    // actividades con hora, en columnas si se enciman
    const ev=items.filter(a=>a.t).map(a=>{const [hh,mm]=a.t.split(':').map(Number),st=hh*60+mm,en=st+(+a.m||30);return {a,st,en,top:Math.max(0,y(hh,mm)),ht:Math.max(18,(+a.m||30)/60*H-2)}}).sort((p,q)=>p.st-q.st||q.en-p.en);
    let grp=[],gEnd=-1;const flush=()=>{const c=[];grp.forEach(b=>{let j=c.findIndex(e=>e<=b.st);if(j<0){j=c.length;c.push(0)}c[j]=b.en;b.col=j});grp.forEach(b=>b.n=c.length);grp=[]};
    ev.forEach(b=>{if(grp.length&&b.st>=gEnd){flush();gEnd=-1}grp.push(b);gEnd=Math.max(gEnd,b.en)});flush();
    const evh=ev.map(b=>{const w=100/b.n;const tiny=b.ht<30;
      return `<div class="wkev${b.a.done?' done':''}${b.a.rid?' rec':''}" style="top:${b.top}px;height:${b.ht}px;left:calc(${w*b.col}% + 2px);width:calc(${w}% - 4px)" onclick="event.stopPropagation();wvEdit('${k}','${b.a.id}')" title="${esc(b.a.n)} · ${fmt12(b.a.t)} · ${b.a.m} min">${tiny?`<b>${esc(b.a.n)}</b> <span class="tm">${fmt12(b.a.t)}</span>`:`<div class="tm">${fmt12(b.a.t)} · ${b.a.m} min</div><b>${b.a.rid?'🔁 ':''}${esc(b.a.n)}</b>`}</div>`}).join('');
    let now='';if(isT){const n=new Date(),hy=y(n.getHours(),n.getMinutes());if(hy>=0&&hy<=totH)now=`<div class="wknow" style="top:${hy}px"></div>`}
    cols+=`<div class="wkcol${isT?' today':''}" data-k="${k}" style="height:${totH}px">${lines}${lg}${evh}${now}<div class="wkghost"></div></div>`});
  const sc=document.querySelector('#wvBody .wkscroll'),keep=sc?sc.scrollTop:null;
  $('wvBody').innerHTML=`<div class="wkscroll"><div class="wk">${head}${all}<div class="wkaxis" style="height:${totH}px">${axis}</div>${cols}</div></div>
    <div class="wvsum"><span>${cnt} actividades planeadas</span><span>${fmtMin(planned)} planeado en la semana</span></div>`;
  const sc2=document.querySelector('#wvBody .wkscroll');
  if(keep!=null)sc2.scrollTop=keep;else{const n=new Date();sc2.scrollTop=Math.max(0,y(Math.max(WV_H0,n.getHours()-2),0))}
  document.querySelectorAll('#wvBody .wkcol').forEach(c=>{const g=c.querySelector('.wkghost');
    const at=e=>{const r=c.getBoundingClientRect(),mins=Math.floor(((e.clientY-r.top)/H*60)/15)*15+WV_H0*60;return Math.max(WV_H0*60,Math.min(WV_H1*60-30,mins))};
    c.addEventListener('mousemove',e=>{if(e.target.closest('.wkev')){g.style.display='none';return}const m=at(e);g.style.display='block';g.style.top=y(0,m-WV_H0*60+WV_H0*60)-0+'px';g.style.top=((m-WV_H0*60)/60*H)+'px';g.style.height=(30/60*H-2)+'px';g.textContent='+ '+fmt12(pad(Math.floor(m/60))+':'+pad(m%60))});
    c.addEventListener('mouseleave',()=>g.style.display='none');
    c.addEventListener('click',e=>{if(e.target.closest('.wkev'))return;const m=at(e);wvCreate(c.dataset.k,pad(Math.floor(m/60))+':'+pad(m%60))})});
  document.querySelectorAll('#wvBody .wkall[data-k]').forEach(c=>c.addEventListener('click',e=>{if(e.target.closest('.wkchip'))return;wvCreate(c.dataset.k,null)}))}
function renderMonth(){const r=kDate(wvRef);r.setDate(1);const m=r.getMonth(),start=wvMon(dkey(r)),td=dkey(new Date());
  $('wvLabel').textContent=MES[m].charAt(0).toUpperCase()+MES[m].slice(1)+' '+r.getFullYear();
  $('wvHint').textContent='Pica un espacio vacío de un día para crear una actividad de 30 min. Pica el número del día para ver esa semana.';
  let h=WD_S.map(w=>`<div class="moh">${w}</div>`).join(''),planned=0,cnt=0;const last=new Date(r.getFullYear(),m+1,0);
  const weeks=Math.ceil((((r.getDay()+6)%7)+last.getDate())/7);
  for(let i=0;i<weeks*7;i++){const k=shiftDay(start,i),d=kDate(k),out=d.getMonth()!==m,items=(out?(plans[k]||[]).filter(a=>!wvHide||!a.done):wvItems(k)).slice().sort((a,b)=>(a.t||'99')<(b.t||'99')?-1:1);

  $('wvBody').innerHTML=`<div class="mo">${h}</div><div class="wvsum"><span>${cnt} actividades planeadas</span><span>${fmtMin(planned)} planeado en el mes</span></div>`;

  const a=new Date(t.getFullYear(),t.getMonth()+rpOff,1),b=new Date(a.getFullYear(),a.getMonth()+1,1);return{a:a.getTime(),b:b.getTime(),days:Math.round((b-a)/864e5)}}

  const ent=log.map((e,i)=>({...e,i,sg:segsOf(e)})).filter(e=>e.sg.length&&e.sg[0].s>=R.a&&e.sg[0].s<R.b);
  const actIv=[],restIv=[];

let ccPts=[];
function ccChart(pts){
  if(pts.length<3)return`<div class="empty">Necesito al menos 3 actividades terminadas con tiempo estimado en este periodo para dibujar la gráfica.</div>`;
  const xs=pts.map(e=>ccUnit==='pct'?(e.real-e.plan)/e.plan*100:e.real-e.plan);
  const mean=xs.reduce((p,q)=>p+q,0)/xs.length;let mr=0;for(let k=1;k<xs.length;k++)mr+=Math.abs(xs[k]-xs[k-1]);mr/=(xs.length-1);
  const ucl=mean+2.66*mr,lcl=mean-2.66*mr,u=ccUnit==='pct'?'%':' min';
  const W=640,H=280,L=52,Rr=14,T=16,B=34;let lo=Math.min(lcl,...xs,0),hi=Math.max(ucl,...xs,0);const pad_=(hi-lo)*.08||5;lo-=pad_;hi+=pad_;
  const X=k=>L+(xs.length===1?0:(W-L-Rr)*k/(xs.length-1)),Y=v=>T+(H-T-B)*(1-(v-lo)/(hi-lo));
  ccPts=pts.map((e,k)=>({e,v:xs[k],out:xs[k]>ucl||xs[k]<lcl}));
  const fmt=v=>(v>0?'+':'')+Math.round(v)+u;
  const hl=(v,c,dash,lab)=>`<line x1="${L}" x2="${W-Rr}" y1="${Y(v)}" y2="${Y(v)}" stroke="${c}" stroke-width="${dash?1.5:2}" ${dash?'stroke-dasharray="5 4"':''}/><text x="${L-6}" y="${Y(v)+4}" text-anchor="end" class="ax">${lab}</text>`;
  let svg=`<svg viewBox="0 0 ${W} ${H}" class="cc" role="img" aria-label="Gráfica de control de la diferencia entre tiempo real y estimado">`;
  svg+=`<rect x="${L}" y="${T}" width="${W-L-Rr}" height="${H-T-B}" fill="none"/>`;
  if(lo<0&&hi>0)svg+=`<line x1="${L}" x2="${W-Rr}" y1="${Y(0)}" y2="${Y(0)}" stroke="#3a3a3c" stroke-width="1"/>`;
  svg+=hl(ucl,'#8e8e93',1,'LSC')+hl(lcl,'#8e8e93',1,'LIC')+hl(mean,'#d1d1d6',0,'Media');
  svg+=`<polyline fill="none" stroke="${C_REST}" stroke-width="2" points="${xs.map((v,k)=>X(k)+','+Y(v)).join(' ')}"/>`;
  const step=Math.max(1,Math.ceil(xs.length/8));
  pts.forEach((e,k)=>{if(k%step===0||k===xs.length-1){const d=new Date(e.sg[0].s);svg+=`<text x="${X(k)}" y="${H-12}" text-anchor="middle" class="ax">${d.getDate()}/${d.getMonth()+1}</text>`}});
  ccPts.forEach((p,k)=>{svg+=`<circle cx="${X(k)}" cy="${Y(p.v)}" r="${p.out?6:5}" fill="${p.out?C_BAD:C_REST}" stroke="#000" stroke-width="2"/><circle cx="${X(k)}" cy="${Y(p.v)}" r="14" fill="transparent" class="hit" onmouseenter="ccShow(${k})" onclick="ccShow(${k})"/>`});
  svg+='</svg>';
  const outN=ccPts.filter(p=>p.out).length;
  return svg+`<div class="ccleg"><span><i style="background:${C_REST}"></i>Actividad</span><span><i style="background:${C_BAD}"></i>Fuera de control</span><span><i class="ln"></i>Media ${fmt(mean)}</span><span><i class="ln dash"></i>Límites ${fmt(lcl)} a ${fmt(ucl)}</span></div>
  <div class="ccnote">${mean>5?`En promedio te tardas <b>${fmt(mean)}</b> de lo que estimas.`:mean<-5?`En promedio terminas <b>${fmt(-mean).replace('+','')}</b> antes de lo estimado.`:'En promedio estimas bien tus tiempos.'} ${outN?`⚠️ <b>${outN}</b> actividad${outN>1?'es':''} fuera de los límites: tócala${outN>1?'s':''} para ver cuál${outN>1?'es':''}.`:'✓ Todas dentro de los límites: tu proceso de estimación es estable.'}</div>`;
}

  <div class="row" style="margin:0;gap:10px"><div style="flex:1"><label>Tiempo estimado (min)</label><input id="mP" type="number" inputmode="numeric" placeholder="ej. 30"></div>
  <div style="flex:1"><label>Tiempo real (min)</label><input id="mR" type="number" inputmode="numeric" placeholder="ej. 45"></div></div>
  <button id="mNow" class="nowbtn" style="display:none" onclick="mSetNow()"></button>
  <label style="display:flex;align-items:center;gap:10px;color:#fff"><input id="mOk" type="checkbox" checked style="width:22px;height:22px"> La terminé</label>
  <div id="mHint" class="muted" style="font-size:13px;display:none">Si no la terminaste, se agrega a tu plan de hoy para continuarla.</div>
  <div class="row"><button class="btn gray" onclick="closeModal()">Cancelar</button><button class="btn" onclick="saveManual()">Guardar</button></div>`);
  mOngoing=false;['mH','mP'].forEach(id=>$(id).addEventListener('input',mNowUpd));$('mR').addEventListener('input',()=>{mOngoing=false;mNowUpd()});
  $('mOk').addEventListener('change',()=>{$('mHint').style.display=$('mOk').checked?'none':'block';if($('mOk').checked){mOngoing=false;mNowUpd()}});
  $('mN').addEventListener('input',()=>{const st=stats()[$('mN').value.trim().toLowerCase()];if(st&&!$('mP').value)$('mP').value=Math.round(st.pavg)});
}
let mOngoing=false;
function mStart(){const h=$('mH').value;if(!h)return null;const [yy,mm,dd]=selDay.split('-').map(Number),[hh,mi]=h.split(':').map(Number);return new Date(yy,mm-1,dd,hh,mi).getTime()}
function mNowUpd(){const b=$('mNow');if(!b)return;const st=mStart(),pl=parseFloat($('mP').value),now=Date.now();
  const show=st!=null&&st<=now;
  if(!show){b.style.display='none';mOngoing=false;return}
  const el=Math.max(1,Math.round((now-st)/60000));b.style.display='block';b.classList.toggle('on',mOngoing);
  b.innerHTML=mOngoing?`✓ Sigue en curso · llevas ${fmtMin(el)}`:`⏱ Sigue en curso (usar hora actual · ${fmtMin(el)})`}
function mSetNow(){const st=mStart();if(st==null)return;$('mR').value=Math.max(1,Math.round((Date.now()-st)/60000));$('mR').style.borderColor='';
  mOngoing=true;$('mOk').checked=false;$('mHint').style.display='block';mNowUpd()}
function saveManual(){
  const n=$('mN').value.trim(),h=$('mH').value||'12:00',r=parseFloat($('mR').value),pl=parseFloat($('mP').value);
  let bad=false;if(!n){$('mN').style.borderColor='#ff3b30';bad=true}if(!(r>0)){$('mR').style.borderColor='#ff3b30';bad=true}if(bad)return;
  const [yy,mm,dd]=selDay.split('-').map(Number),[hh,mi]=h.split(':').map(Number),st=new Date(yy,mm-1,dd,hh,mi).getTime();
  if(!$('mOk').checked){
    const P=pl>0?pl:r,elS=mOngoing?(Date.now()-st)/1000:r*60,tk=dkey(new Date()),id=uid();
    const it={n,m:P,id,prog:{el:elS,rem:Math.max(0,P*60-elS),tot:P*60,ext:[],mb:0,st,segs:[{s:st,e:st+elS*1000}]}};
    plans[tk]=[it].concat(plans[tk]||[]);store('plans',plans);closeModal();setPlanDay(tk);render();renderLog();
    modal(`<h1>Agregada a tu plan ✅</h1><div class="muted">${esc(n)} · llevas ${fmtMin(elS/60)}${it.prog.rem>0?` · quedan ${fmtMin(it.prog.rem/60)}`:' · ya pasó tu estimado'}</div>
    <div class="row"><button class="btn gray" onclick="closeModal()">Después</button><button class="btn" style="background:#ff9f0a;color:#000" onclick="closeModal();tab(1);resumeItem(acts.findIndex(a=>a.id==='${id}'))">▶ Continuar ahora</button></div>`);
    return;
  }
  log.push({d:selDay,h,n,plan:pl>0?pl:r,real:r,ext:[],ok:$('mOk').checked,manual:true,segs:[{s:st,e:st+r*60000}]});
  store('log',log);closeModal();renderLog();
}
function openEntry(i){const e=log[i];if(!e)return;
  const [y,m,d]=e.d.split('-').map(Number),fecha=new Date(y,m-1,d).toLocaleDateString('es-MX',{weekday:'long',day:'numeric',month:'long'});
  const dur=(e.ext||[]).filter(x=>x.note),post=e.post||[];
  const f=ts=>{const x=new Date(ts);return x.toLocaleDateString('es-MX',{day:'numeric',month:'short'})+' '+pad(x.getHours())+':'+pad(x.getMinutes())};
  modal(`<div class="detail"><h1 style="font-size:24px">${esc(e.n)}</h1><div class="muted" style="text-transform:capitalize">${fecha} · ${e.h}</div>
  <div class="meta" style="margin-top:6px">🕒 ${segsOf(e).length>1?'Sesiones: ':''}${segTxt(e)}</div><div class="meta" style="margin-top:4px">Planeado ${fmtMin(e.plan)} · Real ${fmtMin(e.real)}${e.ext&&e.ext.length?` · ${e.ext.length} extensión${e.ext.length>1?'es':''}`:''}</div>
  <h3>📝 Notas durante la actividad</h3>
  ${dur.length?dur.map(x=>`<div class="note"><div class="nh">Al pedir +${x.min} min${x.pct!=null?` · faltaba ${x.pct}%`:''}</div>${esc(x.note).replace(/\n/g,'<br>')}</div>`).join(''):'<div class="muted" style="font-size:14px">Sin notas</div>'}
  <h3>🗒️ Notas después</h3>
  ${post.length?post.map((x,k)=>`<div class="note post"><div class="nh">${f(x.ts)}<button onclick="delPost(${i},${k})">✕</button></div>${esc(x.txt).replace(/\n/g,'<br>')}</div>`).join(''):'<div class="muted" style="font-size:14px">Aún no hay notas</div>'}
  <textarea id="pNote" rows="3" placeholder="Agrega una nota o aprendizaje…" style="margin-top:10px"></textarea>
  <div class="row"><button class="btn gray" onclick="closeModal()">Cerrar</button><button class="btn" onclick="addPost(${i})">＋ Agregar nota</button></div>
  <button class="linkbtn" style="padding:12px 0 0" onclick="editEntry(${i})">✎ Editar este registro</button></div>`);
}
let eeBl=[],eeDay='';
function hhmm(ts){const x=new Date(ts);return pad(x.getHours())+':'+pad(x.getMinutes())}
function editEntry(i){const e=log[i];if(!e)return;eeDay=e.d;
  eeBl=segsOf(e).map(x=>({s:hhmm(x.s),e:hhmm(x.e)}));
  modal(`<h1>Editar registro</h1>
  <label>Actividad</label><input id="eeN" value="${esc(e.n)}">
  <label>Tiempo estimado (min)</label><input id="eeP" type="number" inputmode="decimal" value="${e.plan}" style="width:100%">
  <label>🕒 Bloques de trabajo</label><div id="eeB"></div>
  <button class="addbl" onclick="eeBl.push({s:'',e:''});eeDraw()">＋ Agregar otro bloque</button>
  <div class="eetot" id="eeT"></div>
  <label style="display:flex;align-items:center;gap:10px;color:#fff"><input id="eeOk" type="checkbox" ${e.ok?'checked':''} style="width:22px;height:22px"> La terminé</label>
  <button class="nowbtn" onclick="entryOngoing(${i})">⏱ Sigue en curso (pasarla a mi plan con la hora actual)</button>
  <div class="row"><button class="btn gray" onclick="openEntry(${i})">Cancelar</button><button class="btn" onclick="saveEntry(${i})">✓ Guardar</button></div>`);
  eeDraw();
}
function eeDraw(){$('eeB').innerHTML=eeBl.map((b,k)=>`<div class="blrow"><input type="time" value="${b.s}" oninput="eeBl[${k}].s=this.value;eeTot()"><span>a</span><input type="time" value="${b.e}" oninput="eeBl[${k}].e=this.value;eeTot()">${eeBl.length>1?`<button onclick="eeBl.splice(${k},1);eeDraw()">✕</button>`:''}</div>`).join('');eeTot()}
function eeSegs(){const [y,m,d]=eeDay.split('-').map(Number);return eeBl.filter(b=>b.s&&b.e).map(b=>{const [sh,sm]=b.s.split(':').map(Number),[eh,em]=b.e.split(':').map(Number);
  const s=new Date(y,m-1,d,sh,sm).getTime();let e=new Date(y,m-1,d,eh,em).getTime();if(e<=s)e+=864e5;return{s,e}}).sort((a,b)=>a.s-b.s)}
function eeTot(){const sg=eeSegs(),min=sg.reduce((a,x)=>a+(x.e-x.s),0)/60000;$('eeT').innerHTML=sg.length?`Tiempo real: <b>${fmtMin(min)}</b>${sg.length>1?` en ${sg.length} bloques`:''}`:'Pon la hora de inicio y de fin'}
function entryOngoing(i){const e=log[i];if(!e)return;
  const n=$('eeN').value.trim()||e.n,pl=parseFloat($('eeP').value)||e.plan;
  let sg=eeSegs();if(!sg.length)sg=segsOf(e).map(x=>({...x}));
  const now=Date.now();sg[sg.length-1].e=Math.max(sg[sg.length-1].e,now);
  const elS=sg.reduce((a,x)=>a+(x.e-x.s),0)/1000,tk=dkey(new Date()),id=uid();
  const it={n,m:pl,id,prog:{el:elS,rem:Math.max(0,pl*60-elS),tot:pl*60,ext:e.ext||[],mb:0,st:sg[0].s,segs:sg}};
  log.splice(i,1);plans[tk]=[it].concat(plans[tk]||[]);store('log',log);store('plans',plans);setPlanDay(tk);render();renderLog();
  modal(`<h1>Agregada a tu plan ✅</h1><div class="muted">${esc(n)} · llevas ${fmtMin(elS/60)}${it.prog.rem>0?` · quedan ${fmtMin(it.prog.rem/60)}`:' · ya pasó tu estimado'}</div>
  <div class="row"><button class="btn gray" onclick="closeModal()">Después</button><button class="btn" style="background:#ff9f0a;color:#000" onclick="closeModal();tab(1);resumeItem(acts.findIndex(a=>a.id==='${id}'))">▶ Continuar ahora</button></div>`);
}
function saveEntry(i){const e=log[i];if(!e)return closeModal();
  const n=$('eeN').value.trim(),pl=parseFloat($('eeP').value),sg=eeSegs();
  if(!n){$('eeN').style.borderColor='#ff3b30';return}if(!sg.length){$('eeT').style.color='#ff453a';return}
  const r=Math.round(sg.reduce((a,x)=>a+(x.e-x.s),0)/60000);
  e.n=n;e.real=r;e.plan=pl>0?pl:r;e.ok=$('eeOk').checked;e.segs=sg;e.h=hhmm(sg[0].s);
  store('log',log);renderLog();if($('vAct').classList.contains('on'))renderAct();openEntry(i)}
function addPost(i){const t=$('pNote').value.trim();if(!t){$('pNote').style.borderColor='#ff3b30';return}
  const e=log[i];e.post=(e.post||[]).concat({ts:Date.now(),txt:t});store('log',log);renderLog();openEntry(i)}
function delPost(i,k){const e=log[i];if(!e||!e.post)return;e.post.splice(k,1);if(!e.post.length)delete e.post;store('log',log);renderLog();openEntry(i)}
function rm(i){const e=log[i];if(!e)return;modal(`<h1>¿Borrar registro?</h1><div class="muted">${esc(e.n)} · ${e.h}. También se borran sus notas.</div><div class="row"><button class="btn gray" onclick="closeModal()">Cancelar</button><button class="btn red" onclick="closeModal();log.splice(${i},1);store('log',log);renderLog();renderAct()">Borrar</button></div>`)}
function confirmDel(){return true}
function stats(){const s={};log.filter(e=>e.ok).forEach(e=>{const k=e.n.toLowerCase();s[k]=s[k]||{n:e.n,c:0,sum:0,plan:0,min:1e9,max:0};const o=s[k];o.c++;o.sum+=e.real;o.plan+=e.plan;o.min=Math.min(o.min,e.real);o.max=Math.max(o.max,e.real)});
  Object.values(s).forEach(o=>{o.avg=o.sum/o.c;o.pavg=o.plan/o.c});return s}
function renderAct(){
  const s=Object.values(stats()).sort((a,b)=>b.c-a.c);
  $('actView').innerHTML=s.length?s.map(o=>{const r=o.avg/o.pavg;return`<div class="entry"><div class="top"><b>${esc(o.n)}</b><span class="muted">${o.c} ${o.c>1?'veces':'vez'}</span></div>
  <div class="meta">Promedio real <b style="color:#fff">${fmtMin(o.avg)}</b> · planeabas ${fmtMin(o.pavg)}</div>
  <div class="meta">Rango ${fmtMin(o.min)} – ${fmtMin(o.max)} · <span class="${r>1.05?'over':'under'}">${r>1.05?'tardas '+Math.round((r-1)*100)+'% más de lo que estimas':r<0.95?'terminas '+Math.round((1-r)*100)+'% antes':'estimas bien'}</span></div></div>`}).join(''):'<div class="empty">Aún no hay registros</div>';
}

function exportData(){
  const data=JSON.stringify({app:'temporizador',v:2,plans,log});
  const blob=new Blob([data],{type:'application/json'}),name='temporizador-'+dkey(new Date())+'.json';
  try{const f=new File([blob],name,{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f]}).catch(()=>{});return}}catch(e){}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();
}
function importData(inp){
  const f=inp.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.log))throw 0;
    const seen=new Set(log.map(e=>e.d+e.h+e.n));let n=0;d.log.forEach(e=>{if(!seen.has(e.d+e.h+e.n)){log.push(e);n++}});
    if(d.plans&&typeof d.plans==='object')Object.keys(d.plans).forEach(k=>{if(d.plans[k]&&d.plans[k].length)plans[k]=d.plans[k]});else if(Array.isArray(d.acts)&&d.acts.length)plans[dkey(new Date())]=d.acts;
    setPlanDay(planDay);store('log',log);store('plans',plans);render();renderLog();renderAct();
    modal(`<h1>Importado ✅</h1><div class="muted">${n} registros nuevos y tu plan del día.</div><div class="row"><button class="btn" onclick="closeModal()">OK</button></div>`)}
  catch(e){modal(`<h1>Archivo no válido</h1><div class="row"><button class="btn" onclick="closeModal()">OK</button></div>`)}inp.value=''};
  r.readAsText(f);
}

const fbConfig={apiKey:"AIzaSyBjd6EOuM9VtEodZ7GtEeGY1KG66Umwzgo",authDomain:"temporizador-de-actividades.firebaseapp.com",projectId:"temporizador-de-actividades",storageBucket:"temporizador-de-actividades.firebasestorage.app",messagingSenderId:"150673495434",appId:"1:150673495434:web:468eb73e3bfde86f77a473"};
let lastErr='',fbAuth=null,fbDb=null,user=null,unsub=null,syncT=null,syncState='off',applying=false;
const keyOf=e=>e.d+'|'+e.h+'|'+e.n;
function mergeLogs(a,b){const m=new Map();a.concat(b).forEach(e=>m.set(keyOf(e),e));return [...m.values()]}
function setSync(st){syncState=st;drawSync()}
function drawSync(){
  let h;
  if(!fbAuth)h='<div class="dot err"></div><span>Sin conexión a la nube</span>';
  else if(!user)h='<div class="dot"></div><span>Solo en este dispositivo</span><button onclick="login()">Iniciar sesión</button>';
  else{const t={ok:'Sincronizado',busy:'Guardando…',err:'Error al sincronizar'+(lastErr?' ('+lastErr+')':'')}[syncState]||'Conectando…';
    h=`<div class="dot ${syncState}"></div><span>☁︎ ${t} · ${esc(user.email||'')}</span><button class="lnk" onclick="logout()">Salir</button>`}
  ['syncBar1','syncBar2'].forEach(id=>{const el=$(id);if(el)el.innerHTML=h});
}
function queueSync(){if(!user||applying)return;setSync('busy');clearTimeout(syncT);syncT=setTimeout(pushSync,800)}
function pushSync(){if(!user)return;fixData();fbDb.collection('users').doc(user.uid).set({plans,log,brk,recs,bl,notes,acts:plans[dkey(new Date())]||[],updated:Date.now()}).then(()=>{lastErr='';setSync('ok')}).catch(e=>{console.error(e);lastErr=e&&(e.code||e.message)||'';setSync('err')})}
function applyRemote(d){applying=true;
  if(d.plans&&typeof d.plans==='object')plans=d.plans;else if(Array.isArray(d.acts)){plans={...plans};if(d.acts.length)plans[dkey(new Date())]=d.acts}
  log=d.log||[];if(Array.isArray(d.recs)){recs=d.recs;try{localStorage.setItem('recs',JSON.stringify(recs))}catch(e){}}if(Array.isArray(d.bl)){bl=d.bl;try{localStorage.setItem('bl',JSON.stringify(bl))}catch(e){}}if(Array.isArray(d.notes)){notes=d.notes;try{localStorage.setItem('notes',JSON.stringify(notes))}catch(e){}}fixData();const mv=carryPaused();if(mv)setTimeout(queueSync,50);if(typeof d.brk==='number'){brk=d.brk;try{localStorage.setItem('brk',JSON.stringify(brk))}catch(e){}}setPlanDay(planDay);
  try{localStorage.setItem('plans',JSON.stringify(plans));localStorage.setItem('log',JSON.stringify(log))}catch(e){}applying=false;
  render();if($('s2').classList.contains('on')){renderLog();renderAct()}}
async function onLogin(u){
  user=u;if(unsub){unsub();unsub=null}
  if(!u){setSync('off');return}
  setSync('busy');
  try{
    const ref=fbDb.collection('users').doc(u.uid),snap=await ref.get();
    if(snap.exists){const d=snap.data();
      const rp=(d.plans&&typeof d.plans==='object')?{...d.plans}:{};
      if(!d.plans&&d.acts&&d.acts.length)rp[dkey(new Date())]=d.acts;
      Object.keys(plans).forEach(k=>{if(!(rp[k]&&rp[k].length))rp[k]=plans[k]});
      applyRemote({plans:rp,log:mergeLogs(d.log||[],log),...(Array.isArray(d.recs)?{recs:d.recs}:{}),...(Array.isArray(d.bl)?{bl:d.bl}:{}),notes:mergeNotes(d.notes,notes)});
      await ref.set({plans,log,recs,bl,notes,acts:plans[dkey(new Date())]||[],updated:Date.now()});
    }else await ref.set({plans,log,recs,bl,acts:plans[dkey(new Date())]||[],updated:Date.now()});
    setSync('ok');
    unsub=ref.onSnapshot(s=>{if(!s.exists||s.metadata.hasPendingWrites)return;applyRemote(s.data());setSync('ok')},e=>{console.error(e);lastErr=e&&(e.code||e.message)||'';setSync('err')});
  }catch(e){console.error(e);lastErr=e&&(e.code||e.message)||'';setSync('err')}
}
function login(){const p=new firebase.auth.GoogleAuthProvider();p.setCustomParameters({prompt:'select_account'});
  fbAuth.signInWithPopup(p).catch(e=>{if(e&&e.code==='auth/popup-blocked')modal(`<h1>Safari bloqueó la ventana</h1><div class="muted">Ve a Ajustes → Apps → Safari y apaga <b>Bloquear ventanas</b>. Luego vuelve a tocar Iniciar sesión.</div><div class="row"><button class="btn" onclick="closeModal()">OK</button></div>`);else if(e&&e.code!=='auth/popup-closed-by-user'&&e.code!=='auth/cancelled-popup-request')modal(`<h1>No se pudo iniciar sesión</h1><div class="muted">${esc(e.message||e.code||'')}</div><div class="row"><button class="btn" onclick="closeModal()">OK</button></div>`)})}
function logout(){fbAuth.signOut()}
try{
  firebase.initializeApp(fbConfig);fbAuth=firebase.auth();fbDb=firebase.firestore();
  fbAuth.getRedirectResult().catch(()=>{});
  fbAuth.onAuthStateChanged(onLogin);
}catch(e){console.error(e)}
drawSync();
const APP_VER=76;
async function latestVer(){
  const r=await fetch(location.pathname+'?check='+Date.now(),{cache:'no-store'});const t=await r.text();
  const m=t.match(/const APP_VER=(\d+)/);return m?+m[1]:0;
}
function doUpdate(v){if($('run').classList.contains('on'))saveRun();location.replace(location.pathname+'?v='+v+'&t='+Date.now())}
document.addEventListener('DOMContentLoaded',()=>{const b=$('updBtn');if(b)b.textContent='⟳ Buscar actualización (tienes la v'+APP_VER+')'});
async function checkUpdate(manual){
  const b=$('updBtn');if(manual)b.textContent='⟳ Buscando…';
  try{const v=await latestVer();
    if(v>APP_VER){$('updBox').innerHTML=`<div class="upd"><span>Hay una versión nueva: <b>v${v}</b></span><button onclick="doUpdate(${v})">Actualizar</button></div>`;
      if(manual)doUpdate(v);else b.textContent=`⟳ Actualizar a la v${v}`;}
    else{$('updBox').innerHTML='';if(manual){b.textContent='✓ Ya tienes la versión más nueva (v'+APP_VER+')';setTimeout(()=>b.textContent='⟳ Buscar actualización (tienes la v'+APP_VER+')',3000)}}
  }catch(e){if(manual){b.textContent='Sin conexión, intenta de nuevo';setTimeout(()=>b.textContent='⟳ Buscar actualización (tienes la v'+APP_VER+')',3000)}}
}
if(/[?&](v|t)=/.test(location.search))history.replaceState(null,'',location.pathname);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkUpdate(false)});
initPlans();fixData();render();prev();setTimeout(checkRun,300);setTimeout(()=>checkUpdate(false),1500);
